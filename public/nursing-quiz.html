function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectQuestions(chapterId, count = 20) {
  const pool = BANK[chapterId].questions;
  return shuffle(pool).slice(0, Math.min(count, pool.length));
}

function lsKey(suffix) {
  return 'nursingQuiz_' + encodeURIComponent(state.user) + '_' + suffix;
}

function loadWrong() {
  try { return JSON.parse(localStorage.getItem(lsKey('wrong')) || '{}'); } catch { return {}; }
}

function saveWrong(notes) {
  localStorage.setItem(lsKey('wrong'), JSON.stringify(notes));
}

function getPin() {
  return localStorage.getItem(lsKey('pin'));
}

function setPin(pin) {
  localStorage.setItem(lsKey('pin'), pin);
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return String(h);
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function startTimer() {
  state.timerStart = Date.now();
  state.elapsed = 0;
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
    const el = document.getElementById('timer');
    if (el) el.textContent = fmtTime(state.elapsed);
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
}

function getUserFromURL() {
  const p = new URLSearchParams(window.location.search);
  return p.get('user');
}

function setUserURL(name) {
  const url = new URL(window.location);
  url.searchParams.set('user', name);
  window.history.replaceState({}, '', url);
}

// ============ RENDER ============
const app = document.getElementById('app');

function render() {
  switch(state.view) {
    case 'login': return renderLogin();
    case 'pin': return renderPin();
    case 'chapters': case 'wrongNotes': return renderMain();
    case 'quiz': return renderQuiz();
    case 'results': return renderResults();
  }
}

function renderLogin() {
  app.innerHTML = `
    <div class="login">
      <h2>기초간호임상실무</h2>
      <p>기본 간호 기출문제</p>
      <input type="text" id="nameInput" placeholder="이름을 입력하세요" maxlength="10" autocomplete="off">
      <div style="height:16px"></div>
      <button class="btn btn-pri" data-action="submitName">시작하기</button>
    </div>`;
  setTimeout(() => {
    const inp = document.getElementById('nameInput');
    if (inp) inp.focus();
  }, 100);
}

function renderPin() {
  const isNew = !getPin();
  const title = isNew ? 'PIN 설정 (4자리)' : 'PIN 입력';
  const dots = Array.from({length:4}, (_, i) =>
    `<div class="pin-dot${i < state.pinInput.length ? ' filled' : ''}"></div>`
  ).join('');

  app.innerHTML = `
    <div class="login">
      <h2>${state.user}님</h2>
      <p>${title}</p>
      <div class="pin-dots">${dots}</div>
      <div class="error-msg">${state.pinError}</div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'←'].map(k =>
          k === '' ? '<div></div>' :
          `<div class="pin-key" data-action="pinKey" data-key="${k}">${k}</div>`
        ).join('')}
      </div>
    </div>`;
}

function renderMain() {
  const wrongCount = Object.keys(loadWrong()).length;
  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <h1>기초간호임상실무 - 기본 간호</h1>
        <span class="user-badge">${state.user}</span>
      </div>
      <div class="tabs">
        <div class="tab${state.currentTab==='chapters'?' active':''}" data-action="switchTab" data-tab="chapters">단원별</div>
        <div class="tab${state.currentTab==='wrongNotes'?' active':''}" data-action="switchTab" data-tab="wrongNotes">오답노트${wrongCount ? ' ('+wrongCount+')' : ''}</div>
      </div>
    </div>
    <div id="content"></div>`;
  if (state.currentTab === 'chapters') renderChapters();
  else renderWrongNotes();
}

function renderChapters() {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="chapters">
    ${CHAPTERS.map(id => `
      <div class="ch-card" data-action="startQuiz" data-ch="${id}">
        <div class="ch-num">${id}</div>
        <div class="ch-title">${BANK[id].title}</div>
        <div class="ch-badge">${BANK[id].questions.length}문제</div>
      </div>`).join('')}
  </div>`;
}

function renderWrongNotes() {
  const el = document.getElementById('content');
  const notes = loadWrong();
  const keys = Object.keys(notes);

  if (!keys.length) {
    el.innerHTML = `<div class="wn-empty"><div class="icon">&#10003;</div><p>틀린 문제가 없습니다</p></div>`;
    return;
  }

  // Group by chapter
  const groups = {};
  keys.forEach(k => {
    const n = notes[k];
    const ch = n.chapter;
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push({...n, key: k});
  });

  const optLabels = ['①','②','③','④'];
  let html = `<div class="wrong-notes">
    <div class="wn-header"><h2>오답노트 (${keys.length}문제)</h2></div>
    <div class="wn-actions">
      <button class="btn btn-pri btn-sm" data-action="retakeWrong">오답 다시 풀기</button>
      <button class="btn btn-danger btn-sm" data-action="clearWrong">전체 삭제</button>
    </div>`;

  Object.keys(groups).sort().forEach(ch => {
    html += `<div class="wn-group">
      <div class="wn-group-title">${ch}. ${BANK[ch]?.title || ''}</div>`;
    groups[ch].forEach(n => {
      html += `<div class="wn-item">
        <span class="wn-del" data-action="delWrong" data-key="${n.key}">&times;</span>
        <div class="wn-q">${n.q}</div>
        <div class="wn-detail">
          내 답: ${optLabels[n.userAnswer]} ${n.options[n.userAnswer]}<br>
          정답: ${optLabels[n.answer]} ${n.options[n.answer]}<br>
          ${n.explanation}
        </div>
      </div>`;
    });
    html += '</div>';
  });

  html += '</div>';
  el.innerHTML = html;
}

function renderQuiz() {
  const q = state.questions[state.qIndex];
  const total = state.questions.length;
  const label = state.isWrongMode ? '오답 다시 풀기' : BANK[state.chapter]?.title || '';
  const optLabels = ['①','②','③','④'];

  app.innerHTML = `
    <div class="timer-bar">
      <span>${label}</span>
      <span class="timer" id="timer">${fmtTime(state.elapsed)}</span>
    </div>
    <div class="q-grid" id="qgrid">
      ${state.questions.map((_, i) => {
        let cls = 'q-dot';
        if (state.answers[i] !== undefined) cls += ' answered';
        if (i === state.qIndex) cls += ' current';
        return `<div class="${cls}" data-action="goQ" data-i="${i}">${i+1}</div>`;
      }).join('')}
    </div>
    <div class="q-area">
      <div class="q-label">문제 ${state.qIndex+1} / ${total}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-opts">
        ${q.options.map((o, i) => {
          let cls = 'q-opt';
          if (state.answers[state.qIndex] === i) cls += ' selected';
          return `<div class="${cls}" data-action="selectOpt" data-i="${i}">
            <div class="opt-num">${optLabels[i]}</div>
            <div>${o}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="q-nav">
      ${state.qIndex > 0 ? '<button class="btn btn-out" data-action="prevQ">이전</button>' : '<div></div>'}
      ${state.qIndex < total - 1
        ? '<button class="btn btn-pri" data-action="nextQ">다음</button>'
        : '<div></div>'}
    </div>
    <div style="padding:0 16px 16px">
      <button class="btn btn-pri" style="width:100%;background:${Object.keys(state.answers).length===total?'var(--ok)':'var(--pri)'}" data-action="checkAnswers">
        정답 확인하기 (${Object.keys(state.answers).length}/${total})
      </button>
    </div>`;

  // Scroll current dot into view
  const grid = document.getElementById('qgrid');
  const cur = grid?.querySelector('.current');
  if (cur) cur.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function renderResults() {
  stopTimer();
  const total = state.questions.length;
  let correct = 0;
  const optLabels = ['①','②','③','④'];
  const notes = loadWrong();

  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    if (userAns === q.answer) {
      correct++;
      // If in wrong mode and got it right, remove from wrong notes
      if (state.isWrongMode && notes[q.id]) {
        delete notes[q.id];
      }
    } else {
      // Add to wrong notes
      notes[q.id] = {
        q: q.q,
        options: q.options,
        answer: q.answer,
        explanation: q.explanation,
        userAnswer: userAns !== undefined ? userAns : -1,
        chapter: q.id.split('-')[0]
      };
    }
  });
  saveWrong(notes);

  const pct = Math.round((correct / total) * 100);

  let itemsHtml = state.questions.map((q, i) => {
    const userAns = state.answers[i];
    const isCorrect = userAns === q.answer;
    return `<div class="r-item ${isCorrect ? 'correct' : 'wrong'}">
      <div class="r-q">${i+1}. ${q.q}</div>
      <div class="r-ans">
        ${userAns !== undefined
          ? `내 답: ${optLabels[userAns]} ${q.options[userAns]}`
          : '미응답'}
        ${!isCorrect ? ` / 정답: ${optLabels[q.answer]} ${q.options[q.answer]}` : ''}
      </div>
      ${!isCorrect ? `<div class="r-exp">${q.explanation}</div>` : ''}
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="results">
      <div class="score-card">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}% 정답 &middot; ${fmtTime(state.elapsed)}</div>
      </div>
      ${itemsHtml}
      <div class="r-btns">
        ${!state.isWrongMode ? `<button class="btn btn-out" data-action="retryChapter">다시 풀기</button>` : ''}
        <button class="btn btn-pri" data-action="goHome">단원 선택</button>
      </div>
    </div>`;
}

function showConfirm(title, msg, onYes) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="dialog">
    <h3>${title}</h3>
    <p>${msg}</p>
    <div class="d-btns">
      <button class="btn btn-out" id="dlgNo">취소</button>
      <button class="btn btn-pri" id="dlgYes">확인</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#dlgNo').onclick = () => overlay.remove();
  overlay.querySelector('#dlgYes').onclick = () => { overlay.remove(); onYes(); };
}

// ============ ACTIONS ============
function handleAction(action, target) {
  switch(action) {
    case 'submitName': {
      const inp = document.getElementById('nameInput');
      const name = inp?.value.trim();
      if (!name) return;
      state.user = name;
      setUserURL(name);
      state.view = 'pin';
      state.pinInput = '';
      state.pinError = '';
      render();
      break;
    }
    case 'pinKey': {
      const key = target.dataset.key;
      if (key === '←') {
        state.pinInput = state.pinInput.slice(0, -1);
        state.pinError = '';
        render();
      } else if (state.pinInput.length < 4) {
        state.pinInput += key;
        state.pinError = '';
        render();
        if (state.pinInput.length === 4) {
          setTimeout(() => handlePinComplete(), 150);
        }
      }
      break;
    }
    case 'switchTab': {
      state.currentTab = target.dataset.tab;
      state.view = state.currentTab;
      render();
      break;
    }
    case 'startQuiz': {
      const ch = target.dataset.ch;
      state.chapter = ch;
      state.questions = selectQuestions(ch);
      state.answers = {};
      state.qIndex = 0;
      state.isWrongMode = false;
      state.view = 'quiz';
      startTimer();
      render();
      break;
    }
    case 'goQ': {
      state.qIndex = parseInt(target.dataset.i);
      render();
      break;
    }
    case 'selectOpt': {
      state.answers[state.qIndex] = parseInt(target.dataset.i);
      render();
      break;
    }
    case 'prevQ': {
      if (state.qIndex > 0) { state.qIndex--; render(); }
      break;
    }
    case 'nextQ': {
      if (state.qIndex < state.questions.length - 1) { state.qIndex++; render(); }
      break;
    }
    case 'checkAnswers': {
      const unanswered = state.questions.length - Object.keys(state.answers).length;
      if (unanswered > 0) {
        showConfirm('정답 확인', `아직 ${unanswered}문제를 풀지 않았습니다. 그래도 확인하시겠습니까?`, () => {
          state.view = 'results';
          render();
        });
      } else {
        state.view = 'results';
        render();
      }
      break;
    }
    case 'retryChapter': {
      state.questions = selectQuestions(state.chapter);
      state.answers = {};
      state.qIndex = 0;
      state.view = 'quiz';
      startTimer();
      render();
      break;
    }
    case 'goHome': {
      stopTimer();
      state.currentTab = 'chapters';
      state.view = 'chapters';
      render();
      break;
    }
    case 'retakeWrong': {
      const notes = loadWrong();
      const keys = Object.keys(notes);
      if (!keys.length) return;
      const qs = keys.map(k => {
        const n = notes[k];
        return {
          id: k,
          q: n.q,
          options: n.options,
          answer: n.answer,
          explanation: n.explanation
        };
      });
      state.questions = shuffle(qs).slice(0, 20);
      state.answers = {};
      state.qIndex = 0;
      state.isWrongMode = true;
      state.view = 'quiz';
      startTimer();
      render();
      break;
    }
    case 'delWrong': {
      const notes = loadWrong();
      delete notes[target.dataset.key];
      saveWrong(notes);
      renderWrongNotes();
      // Update tab badge
      const tab = document.querySelector('[data-tab="wrongNotes"]');
      const c = Object.keys(loadWrong()).length;
      if (tab) tab.textContent = '오답노트' + (c ? ' ('+c+')' : '');
      break;
    }
    case 'clearWrong': {
      showConfirm('전체 삭제', '오답노트를 모두 삭제하시겠습니까?', () => {
        saveWrong({});
        render();
      });
      break;
    }
  }
}

function handlePinComplete() {
  const stored = getPin();
  if (!stored) {
    // New user - set PIN
    setPin(simpleHash(state.pinInput));
    state.authenticated = true;
    state.view = 'chapters';
    state.currentTab = 'chapters';
    render();
  } else {
    // Check PIN
    if (simpleHash(state.pinInput) === stored) {
      state.authenticated = true;
      state.view = 'chapters';
      state.currentTab = 'chapters';
      render();
    } else {
      state.pinInput = '';
      state.pinError = 'PIN이 틀렸습니다. 다시 입력하세요.';
      render();
    }
  }
}

// ============ EVENT DELEGATION ============
app.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (target) handleAction(target.dataset.action, target);
});

// Enter key for name input
app.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && state.view === 'login') {
    handleAction('submitName', null);
  }
});

// ============ INIT ============
(function init() {
  const urlUser = getUserFromURL();
  if (urlUser) {
    state.user = urlUser;
    state.view = 'pin';
    state.pinInput = '';
    state.pinError = '';
  } else {
    state.view = 'login';
  }
  render();
})();
</script>
</body>
</html>
