<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>기초간호임상실무 - 기본 간호</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#4A90D9;--pri-light:#E8F0FE;--pri-dark:#2563EB;
  --ok:#34A853;--ok-light:#E6F4EA;
  --no:#EA4335;--no-light:#FCE8E6;
  --g1:#F5F5F5;--g2:#E0E0E0;--g3:#9E9E9E;--g4:#616161;
  --bg:#FFFFFF;--text:#1A1A1A;
  --r:12px;--sh:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F0F2F5;color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--pri);color:#fff;padding:12px 16px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
.header .user-badge{font-size:12px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s;background:rgba(255,255,255,.15)}
.tab.active{background:#fff;color:var(--pri)}
.timer-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--g1);font-size:13px;font-weight:600;border-bottom:1px solid var(--g2)}
.timer{font-variant-numeric:tabular-nums;color:var(--pri)}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:24px;text-align:center}
.login h2{font-size:20px;margin-bottom:8px}
.login p{font-size:14px;color:var(--g3);margin-bottom:24px}
.login input{width:100%;max-width:280px;padding:14px;border:2px solid var(--g2);border-radius:var(--r);font-size:16px;text-align:center;outline:none;transition:border .2s}
.login input:focus{border-color:var(--pri)}
.login .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.login .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--g2);transition:all .2s}
.login .pin-dot.filled{background:var(--pri);border-color:var(--pri)}
.login .pin-input{position:absolute;opacity:0;width:1px}
.login .pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;margin-top:16px}
.login .pin-key{width:72px;height:56px;border:1px solid var(--g2);border-radius:var(--r);font-size:20px;font-weight:600;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;user-select:none}
.login .pin-key:active{background:var(--pri-light)}
.login .pin-key.wide{grid-column:span 1}
.login .error-msg{color:var(--no);font-size:13px;margin-top:12px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;user-select:none}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:active{background:var(--pri-dark)}
.btn-out{background:transparent;border:2px solid var(--pri);color:var(--pri)}
.btn-danger{background:var(--no);color:#fff}
.btn-sm{padding:8px 16px;font-size:12px}

/* Chapters */
.chapters{padding:12px}
.ch-card{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;background:var(--g1);border-radius:var(--r);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ch-card:active{transform:scale(.98);box-shadow:var(--sh)}
.ch-num{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ch-title{font-size:14px;font-weight:600;flex:1}
.ch-badge{font-size:11px;color:var(--g3);background:var(--g2);padding:2px 8px;border-radius:10px}

/* Quiz */
.quiz-header{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--g1);border-bottom:1px solid var(--g2)}
.quiz-header .ch-label{font-size:13px;font-weight:600;flex:1}
.quiz-header .btn-exit{font-size:12px;color:var(--g4);cursor:pointer;padding:4px 8px}
.q-grid{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.q-grid::-webkit-scrollbar{display:none}
.q-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--g2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s;background:#fff;color:var(--g4)}
.q-dot.answered{background:var(--pri-light);border-color:var(--pri);color:var(--pri)}
.q-dot.current{border-color:var(--pri-dark);box-shadow:0 0 0 3px rgba(74,144,217,.3)}
.q-area{padding:20px 16px}
.q-label{font-size:12px;color:var(--g3);margin-bottom:8px}
.q-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:20px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:14px;border:2px solid var(--g2);border-radius:var(--r);cursor:pointer;font-size:14px;line-height:1.4;transition:all .15s}
.q-opt:active{transform:scale(.99)}
.q-opt .opt-num{width:24px;height:24px;border-radius:50%;border:2px solid var(--g2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .15s}
.q-opt.selected{border-color:var(--pri);background:var(--pri-light)}
.q-opt.selected .opt-num{background:var(--pri);border-color:var(--pri);color:#fff}
.q-nav{display:flex;gap:8px;padding:16px;border-top:1px solid var(--g2)}
.q-nav .btn{flex:1}

/* Results */
.results{padding:16px}
.score-card{text-align:center;padding:24px;background:linear-gradient(135deg,var(--pri),var(--pri-dark));color:#fff;border-radius:var(--r);margin-bottom:16px}
.score-card .score-num{font-size:48px;font-weight:800}
.score-card .score-sub{font-size:14px;opacity:.8;margin-top:4px}
.r-item{padding:14px;margin-bottom:8px;border-radius:var(--r);border-left:4px solid}
.r-item.correct{border-color:var(--ok);background:var(--ok-light)}
.r-item.wrong{border-color:var(--no);background:var(--no-light)}
.r-item .r-q{font-size:13px;font-weight:600;margin-bottom:6px}
.r-item .r-ans{font-size:12px;color:var(--g4);margin-bottom:4px}
.r-item .r-exp{font-size:12px;color:var(--g4);padding:8px;background:rgba(0,0,0,.04);border-radius:8px;margin-top:6px;line-height:1.4}
.r-btns{display:flex;gap:8px;margin-top:16px}
.r-btns .btn{flex:1}

/* Wrong Notes */
.wrong-notes{padding:16px}
.wn-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wn-header h2{font-size:16px}
.wn-empty{text-align:center;padding:60px 24px;color:var(--g3)}
.wn-empty .icon{font-size:48px;margin-bottom:12px}
.wn-group{margin-bottom:16px}
.wn-group-title{font-size:13px;font-weight:700;color:var(--pri);padding:8px 0;border-bottom:1px solid var(--g2);margin-bottom:8px}
.wn-item{padding:12px;background:var(--g1);border-radius:var(--r);margin-bottom:6px;font-size:13px}
.wn-item .wn-q{font-weight:600;margin-bottom:4px}
.wn-item .wn-detail{font-size:12px;color:var(--g4);line-height:1.4}
.wn-item .wn-del{float:right;color:var(--no);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.wn-actions{display:flex;gap:8px;margin-bottom:16px}

/* Confirm dialog */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:#fff;border-radius:var(--r);padding:24px;max-width:320px;width:100%;text-align:center}
.dialog h3{font-size:16px;margin-bottom:8px}
.dialog p{font-size:13px;color:var(--g4);margin-bottom:16px}
.dialog .d-btns{display:flex;gap:8px}
.dialog .d-btns .btn{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============ QUESTION BANK ============
const QB_RAW = {
"01": {
    t: "병원 환경 조성 돕기",
    q: [
      ["병실의 적정 온도 범위로 옳은 것은?", "16~18°C|20~22°C|24~26°C|28~30°C", 1, "병실의 적정 온도는 20~22°C이다."],
      ["병실의 적정 습도 범위로 옳은 것은?", "20~30%|30~40%|40~60%|70~80%", 2, "병실의 적정 습도는 40~60%이다."],
      ["병실 환기의 목적으로 가장 거리가 먼 것은?", "실내 공기 정화|불쾌한 냄새 제거|병실 온도 상승|공기 중 미생물 감소", 2, "환기의 목적은 공기 정화, 냄새 제거, 미생물 감소이며 온도 상승은 목적이 아니다."],
      ["병실 조명에 대한 설명으로 옳은 것은?", "직접 조명이 가장 적합하다|야간에는 간접 조명을 사용한다|모든 환자에게 동일한 밝기를 유지한다|형광등은 사용을 금한다", 1, "야간에는 환자의 수면을 방해하지 않도록 간접 조명을 사용한다."],
      ["병실 소음 관리로 적절하지 않은 것은?", "대화 소리를 낮춘다|문을 조용히 닫는다|고무바퀴 달린 기구를 사용한다|야간에 환자 교육을 실시한다", 3, "야간에는 소음을 최소화하여 환자의 수면을 보장해야 하므로 교육은 주간에 실시한다."],
      ["낙상 예방을 위한 간호 중재로 옳지 않은 것은?", "침대 난간을 올려준다|바닥의 물기를 즉시 닦는다|야간에 조명을 완전히 소등한다|미끄럼 방지 신발을 신긴다", 2, "야간에도 안전을 위해 보조등을 켜두어야 하며 완전 소등은 낙상 위험을 증가시킨다."],
      ["화재 발생 시 간호사의 우선순위 행동으로 옳은 것은?", "소화기로 불을 끈다|119에 신고한다|환자를 대피시킨다|화재 원인을 조사한다", 2, "화재 시 RACE 원칙에 따라 환자 대피(Rescue)가 최우선이다."],
      ["병실 침상 간 적정 간격으로 옳은 것은?", "0.5m 이상|1.0m 이상|1.5m 이상|2.0m 이상", 1, "병실 침상 간 간격은 최소 1.0m 이상을 유지해야 한다."],
      ["억제대 적용 시 주의사항으로 옳지 않은 것은?", "2시간마다 풀어서 순환 상태를 확인한다|매듭은 빨리 풀 수 있는 것으로 한다|가능한 한 오래 적용하여 안전을 확보한다|억제대 적용 사유를 기록한다", 2, "억제대는 최소한의 시간 동안만 적용해야 하며, 가능한 한 오래 적용하는 것은 부적절하다."],
      ["병실 환경에서 소음의 허용 기준으로 옳은 것은?", "주간 35dB 이하|주간 45dB 이하|주간 55dB 이하|주간 65dB 이하", 1, "병원 소음 허용 기준은 주간 45dB 이하이다."],
      ["병원 감염 예방을 위한 병실 환경 관리로 적절한 것은?", "화분에 물을 자주 준다|커튼은 분기별 1회 세탁한다|습식 청소를 한다|카펫을 깔아 소음을 줄인다", 2, "병원 감염 예방을 위해 습식 청소를 시행하여 먼지 비산을 방지한다."],
      ["병실 안전 관리에 해당하지 않는 것은?", "전기 기구 안전 점검|비상구 확인 및 표시|침상 높이를 가장 높게 유지|바닥 장애물 제거", 2, "침상 높이는 낮게 유지하여 낙상을 예방해야 한다."],
      ["환자의 프라이버시 보호를 위한 방법으로 적절하지 않은 것은?", "커튼이나 스크린을 사용한다|처치 시 문을 닫는다|다른 환자 앞에서 진단명을 말한다|노출을 최소화한다", 2, "다른 환자 앞에서 진단명을 말하는 것은 프라이버시를 침해하는 행위이다."],
      ["병원 화재 시 RACE 원칙 중 A에 해당하는 것은?", "Alarm(경보)|Aid(도움)|Assess(사정)|Activate(활성화)", 0, "RACE: Rescue(구출), Alarm(경보), Contain(차단), Extinguish(소화)이다."],
      ["Fowler 체위에서 침상 머리의 각도로 옳은 것은?", "15~30도|45~60도|60~75도|80~90도", 1, "Fowler 체위는 침상 머리를 45~60도로 올린 체위이다."],
      ["반좌위(Semi-Fowler) 체위에서 침상 머리의 각도는?", "15~30도|30~45도|45~60도|60~90도", 1, "반좌위(Semi-Fowler)는 침상 머리를 30~45도 올린 체위이다."],
      ["병실 환기 시 적절한 방법은?", "환자에게 직접 바람이 닿도록 한다|하루 1회 10분 이상 환기한다|창문을 항상 열어둔다|한쪽 창문만 연다", 1, "하루에 최소 1회 이상 10분 이상 환기하여 실내 공기를 교환한다."],
      ["병실 조명 중 검사나 처치 시 사용하는 조명은?", "간접 조명|국소 조명|자연 조명|야간 조명", 1, "검사나 처치 시에는 해당 부위를 집중적으로 비추는 국소 조명을 사용한다."],
      ["입원 환자의 안전을 위해 확인해야 할 사항으로 가장 거리가 먼 것은?", "환자 인식 팔찌 확인|알레르기 유무 확인|환자의 취미 확인|낙상 위험도 사정", 2, "환자의 취미는 안전과 직접적인 관련이 없다."],
      ["병상 환경에서 커튼의 역할로 옳지 않은 것은?", "프라이버시 보호|빛 조절|감염 차단|공간 분리", 2, "커튼은 프라이버시 보호, 빛 조절, 공간 분리에 사용되나 감염 차단 기능은 없다."],
      ["병실 바닥 관리로 적절한 것은?", "건식 청소 후 왁스를 바른다|습식 청소를 하되 물기를 즉시 제거한다|카펫을 깔아 소음을 줄인다|하루 1회만 청소한다", 1, "습식 청소로 먼지 비산을 막고, 물기는 즉시 제거하여 낙상을 예방한다."],
      ["신생아실의 적정 온도로 옳은 것은?", "18~20°C|20~22°C|24~26°C|28~30°C", 2, "신생아실은 24~26°C의 온도를 유지해야 한다."],
      ["수술실의 적정 온도로 옳은 것은?", "15~18°C|20~24°C|25~28°C|28~30°C", 1, "수술실의 적정 온도는 20~24°C이다."],
      ["억제대 적용 시 손가락 몇 개가 들어가는 여유를 두어야 하는가?", "1개|2개|3개|4개", 1, "억제대와 피부 사이에 손가락 2개 정도의 여유를 두어 순환 장애를 예방한다."],
      ["병실에서 사용하는 침대의 기능으로 적절하지 않은 것은?", "높이 조절|머리 부분 각도 조절|발 부분 각도 조절|자동 체위 변경", 3, "일반 병실 침대는 높이, 머리, 발 부분 각도 조절이 가능하나 자동 체위 변경 기능은 일반적이지 않다."],
      ["환자 안전사고 보고에 대한 설명으로 옳은 것은?", "경미한 사고는 보고하지 않아도 된다|사고 발생 즉시 보고한다|주치의에게만 보고한다|보호자에게 먼저 알린다", 1, "환자 안전사고는 경중에 관계없이 즉시 보고하여야 한다."],
      ["병실 온도가 너무 높을 때 환자에게 나타날 수 있는 증상은?", "혈압 상승|오한|식욕 감소 및 피로감|호흡 감소", 2, "고온 환경에서는 식욕 감소, 피로감, 불쾌감 등이 나타날 수 있다."],

      ["기립성 저혈압 확인을 위한 혈압 측정 방법으로 옳은 것은?", "좌위와 우위에서 각각 측정한다|양팔에서 동시에 측정한다|누운 자세에서 선 자세로 변경 후 측정한다|운동 전후 측정한다", 2, "기립성 저혈압은 누운 자세에서 앉거나 선 자세로 변경 후 혈압 변화를 비교한다."],

      ["전자 체온계로 구강 체온 측정 시 삽입 부위로 적절한 곳은?", "혀 위|혀 아래 소대 양옆|잇몸과 볼 사이|입천장", 1, "구강 체온계는 혀 아래 설소대 양옆(후설하낭)에 삽입한다."],
      ["혈압 측정 시 팔의 위치가 심장보다 높으면 혈압은?", "높게 측정된다|낮게 측정된다|정확하게 측정된다|측정할 수 없다", 1, "팔이 심장보다 높으면 중력의 영향으로 혈압이 실제보다 낮게 측정된다."],
      ["호흡의 깊이, 리듬, 양상을 관찰할 때 사용하는 용어 중 '무호흡'은?", "Dyspnea|Apnea|Orthopnea|Hyperpnea", 1, "Apnea는 호흡이 일시적으로 멈추는 무호흡 상태를 말한다."],
      ["체온 측정 시 구강 체온 측정이 금기인 환자는?", "고혈압 환자|의식이 없는 환자|당뇨병 환자|빈혈 환자", 1, "의식이 없는 환자는 체온계를 물고 있을 수 없으므로 구강 체온 측정이 금기이다."]
    ]
  },
  "04": {
    t: "건강 사정 돕기",
    q: [
      ["건강 사정의 4가지 기본 기법을 올바른 순서로 나열한 것은?", "시진→촉진→타진→청진|촉진→시진→타진→청진|청진→시진→촉진→타진|타진→청진→시진→촉진", 0, "기본 순서는 시진(inspection) → 촉진(palpation) → 타진(percussion) → 청진(auscultation)이다."],
      ["복부 사정 시 순서가 다른 이유는?", "복부는 특별한 구조가 없어서|청진 전에 촉진하면 장음이 변할 수 있어서|복부는 타진이 불필요해서|복부는 시진만으로 충분해서", 1, "복부 사정은 시진→청진→타진→촉진 순으로, 촉진이나 타진이 장음을 변화시킬 수 있기 때문이다."],
      ["시진(inspection)에 대한 설명으로 옳은 것은?", "손으로 만져서 사정하는 방법이다|눈으로 관찰하는 방법이다|두드려서 소리를 듣는 방법이다|청진기로 소리를 듣는 방법이다", 1, "시진은 눈으로 체계적으로 관찰하는 방법이다."],
      ["타진(percussion) 시 폐에서 정상적으로 들리는 소리는?", "공명음(resonance)|과공명음(hyperresonance)|탁음(dullness)|고음(tympany)", 0, "정상 폐에서는 공명음(resonance)이 들린다."],
      ["타진 시 간이나 심장 부위에서 들리는 소리는?", "공명음|과공명음|탁음|고음", 2, "간이나 심장처럼 밀도가 높은 장기에서는 탁음(dullness)이 들린다."],
      ["타진 시 위의 공기 부위에서 들리는 소리는?", "공명음|과공명음|탁음|고음", 3, "위의 공기가 있는 부위에서는 고음(tympany)이 들린다."],
      ["건강력(health history) 수집 시 현병력에 포함되는 것은?", "과거 수술력|가족의 질환력|현재 증상의 발생 시기와 양상|예방접종력", 2, "현병력은 현재 건강 문제의 발생 시기, 양상, 기간, 악화·완화 요인 등을 포함한다."],
      ["신체검진 시 사용하는 도구가 아닌 것은?", "청진기|검안경|혈압계|심전도기", 3, "심전도기는 특수 검사 장비로, 기본 신체검진 도구에는 포함되지 않는다."],
      ["촉진(palpation)으로 사정할 수 있는 것이 아닌 것은?", "피부 온도|종괴의 크기|장음의 빈도|복부 압통", 2, "장음의 빈도는 청진으로 사정하며 촉진으로는 확인할 수 없다."],
      ["정상 장음의 빈도로 옳은 것은?", "1~3회/분|5~35회/분|40~60회/분|60~80회/분", 1, "정상 장음은 분당 5~35회로, 불규칙적인 구르르 소리가 들린다."],
      ["동공 반사 검사 시 정상 반응은?", "빛을 비추면 동공이 산동된다|빛을 비추면 동공이 축동된다|빛에 반응하지 않는다|양쪽 동공 크기가 다르다", 1, "정상적으로 빛을 비추면 동공이 수축(축동)된다."],
      ["Glasgow Coma Scale(GCS)의 최고 점수는?", "10점|12점|15점|20점", 2, "GCS 최고 점수는 15점이다(눈 4 + 언어 5 + 운동 6)."],
      ["Glasgow Coma Scale(GCS)의 최저 점수는?", "0점|1점|3점|5점", 2, "GCS 최저 점수는 3점이다(눈 1 + 언어 1 + 운동 1)."],
      ["청진(auscultation)으로 사정하는 것이 아닌 것은?", "심음|장음|호흡음|피부 탄력성", 3, "피부 탄력성은 촉진으로 사정하며 청진 대상이 아니다."],
      ["건강 사정에서 '주소(chief complaint)'란?", "환자의 집 주소|환자가 병원을 찾은 주된 이유|의사의 진단명|간호사의 판단", 1, "주소는 환자가 의료기관을 방문하게 된 주된 건강 문제를 말한다."],
      ["함요부종(pitting edema) 사정 방법으로 옳은 것은?", "청진기로 소리를 듣는다|손가락으로 5~10초간 눌러 관찰한다|줄자로 둘레를 측정한다|피부색을 관찰한다", 1, "함요부종은 손가락으로 5~10초간 눌러 오목하게 들어간 정도와 회복 시간을 관찰한다."],
      ["피부 탄력성(turgor) 사정 부위로 적절한 곳은?", "손등|전완 내측 또는 쇄골 하부|복부|대퇴부", 1, "피부 탄력성은 전완 내측이나 쇄골 하부 피부를 잡아당겨 복원 속도를 관찰한다."],
      ["청진기의 벨(bell)형으로 듣기 적합한 소리는?", "고음의 소리|저음의 소리|정상 호흡음|장음", 1, "벨형은 저음의 소리(예: 혈관 잡음, 이완기 심잡음)를 듣기에 적합하다."],
      ["청진기의 막(diaphragm)형으로 듣기 적합한 소리는?", "저음의 혈관 잡음|고음의 호흡음과 장음|심장 이완기 잡음|정맥혈류음", 1, "막형은 고음의 소리(정상 호흡음, 장음, 수축기 심잡음)를 듣기에 적합하다."],
      ["면담 시 개방형 질문의 예로 옳은 것은?", "통증이 있습니까?|열이 납니까?|어디가 불편하십니까?|약을 드셨습니까?", 2, "'어디가 불편하십니까?'는 환자가 자유롭게 대답할 수 있는 개방형 질문이다."],
      ["활력 징후를 제외한 신체 계측에 포함되지 않는 것은?", "신장|체중|두위|혈당", 3, "혈당은 검사 항목이며 신체 계측에는 신장, 체중, 두위, 흉위 등이 포함된다."],
      ["BMI(체질량지수) 계산 공식으로 옳은 것은?", "체중(kg) ÷ 신장(m)|체중(kg) ÷ 신장(m)²|신장(cm) ÷ 체중(kg)|체중(kg) × 신장(m)", 1, "BMI = 체중(kg) ÷ 신장(m)²이다."],
      ["정상 성인 BMI 범위로 옳은 것은?", "16.0~18.4|18.5~24.9|25.0~29.9|30.0~34.9", 1, "정상 BMI는 18.5~24.9이다."],
      ["복부 사정 시 장음이 5분간 들리지 않을 때 이를 무엇이라 하는가?", "장음 항진|장음 감소|장음 소실|정상 장음", 2, "5분간 장음이 전혀 들리지 않으면 장음 소실(absent bowel sounds)이라 한다."],
      ["반사 검사 중 슬개건 반사에 사용하는 도구는?", "음차|타진 해머|펜라이트|설압자", 1, "슬개건 반사는 타진 해머(reflex hammer)로 슬개건을 두드려 검사한다."],
      ["피부 사정 시 황달(jaundice)이 가장 먼저 관찰되는 부위는?", "손바닥|복부|공막(눈 흰자위)|발바닥", 2, "황달은 공막에서 가장 먼저 관찰된다."],
      ["경정맥 팽창(JVD)을 관찰할 때 환자의 적절한 체위는?", "앙와위|45도 반좌위|좌위|복위", 1, "경정맥 팽창은 45도 반좌위에서 관찰한다."],
      ["면담 기법 중 '반영(reflection)'이란?", "환자의 말을 반복하는 것|환자의 감정을 되돌려 표현하는 것|질문을 바꿔 다시 묻는 것|대화를 요약하는 것", 1, "반영은 환자가 표현한 감정이나 느낌을 되돌려 말해주는 의사소통 기법이다."],
      ["건강 사정에서 과거력(past history)에 포함되는 것은?", "현재 복용 약물|이전 수술 경험|가족의 질병력|현재 주 증상", 1, "과거력에는 이전 질환, 수술, 입원 경험, 알레르기, 예방접종력 등이 포함된다."],
      ["근골격계 사정에서 ROM이 의미하는 것은?", "호흡률|관절 운동 범위|심박출량|산소포화도", 1, "ROM(Range of Motion)은 관절의 운동 범위를 의미한다."]
    ]
  },
  "05": {
    t: "감염 관리와 무균술 돕기",
    q: [
      ["물과 비누를 이용한 손위생 시간으로 권장되는 것은?", "10~20초|20~30초|40~60초|60~90초", 2, "물과 비누를 이용한 손위생은 40~60초가 권장된다."],
      ["알코올 손소독제를 이용한 손위생 시간으로 권장되는 것은?", "10~15초|20~30초|40~60초|60~90초", 1, "알코올 손소독제를 이용한 손위생은 20~30초가 권장된다."],
      ["손위생이 필요한 시점(WHO 5 Moments)에 해당하지 않는 것은?", "환자 접촉 전|무균 처치 전|식사 후|체액 노출 위험 후", 2, "WHO 5 Moments는 환자 접촉 전, 무균 처치 전, 체액 노출 위험 후, 환자 접촉 후, 환자 주변 환경 접촉 후이다."],
      ["멸균 영역 관리 원칙으로 옳지 않은 것은?", "멸균 영역 위에서만 물품을 전달한다|멸균 영역에서 눈을 떼지 않는다|멸균물품은 허리 위에서 다룬다|의심스러우면 오염된 것으로 간주한다", 0, "멸균 영역 위를 지나면서 물품을 전달하면 오염될 수 있으므로 금지한다."],
      ["멸균 장갑 착용 시 처음 꺼낼 때 잡는 부위는?", "장갑의 손가락 부분|장갑의 손목 안쪽 접힌 부분(커프)|장갑의 손등 부분|장갑의 손바닥 부분", 1, "첫 번째 장갑을 꺼낼 때는 접혀 있는 커프(손목 안쪽)를 잡아 맨손이 멸균면에 닿지 않게 한다."],
      ["표준주의(Standard Precautions)에 해당하는 것은?", "특정 감염병 환자에게만 적용한다|모든 환자의 혈액, 체액에 적용한다|공기전파 환자에게만 적용한다|접촉전파 환자에게만 적용한다", 1, "표준주의는 감염 여부와 관계없이 모든 환자의 혈액과 체액에 적용한다."],
      ["결핵 환자의 격리에 적용되는 전파경로별 주의는?", "접촉주의|비말주의|공기주의|표준주의만 적용", 2, "결핵은 공기 전파되므로 공기주의(Airborne Precautions)를 적용한다."],
      ["공기주의 격리 시 사용하는 마스크는?", "일반 수술용 마스크|N95 마스크|면 마스크|비닐 마스크", 1, "공기주의 시 미세 입자를 걸러낼 수 있는 N95 마스크를 착용한다."],
      ["비말주의가 필요한 감염병은?", "결핵|인플루엔자|수두|홍역", 1, "인플루엔자는 비말 전파되므로 비말주의를 적용한다."],
      ["접촉주의가 필요한 감염병은?", "결핵|홍역|MRSA 감염|수두", 2, "MRSA 감염은 접촉 전파되므로 접촉주의를 적용한다."],
      ["고압증기멸균(autoclave)의 조건으로 옳은 것은?", "100°C, 30분|121°C, 15~20분|150°C, 10분|180°C, 5분", 1, "고압증기멸균은 121°C에서 15~20분간 시행한다."],
      ["소독과 멸균의 차이점으로 옳은 것은?", "소독은 아포를 포함한 모든 미생물을 제거한다|멸균은 병원성 미생물만 제거한다|멸균은 아포를 포함한 모든 미생물을 제거한다|소독과 멸균은 동일하다", 2, "멸균은 아포를 포함한 모든 미생물을 완전히 제거하는 것이고, 소독은 아포를 제외한 병원성 미생물을 제거하는 것이다."],
      ["멸균 물품의 유효 기간에 영향을 미치는 요인으로 거리가 먼 것은?", "포장 재질|보관 환경|멸균 물품의 색상|취급 빈도", 2, "멸균 물품의 색상은 유효 기간과 관계없으며, 포장 재질, 보관 환경, 취급 빈도가 영향을 미친다."],
      ["멸균 포장이 젖었을 때 취해야 할 조치는?", "건조시킨 후 사용한다|오염된 것으로 간주하고 재멸균한다|겉만 닦고 사용한다|멸균 표시를 확인 후 사용한다", 1, "멸균 포장이 젖으면 미생물이 통과할 수 있으므로 오염된 것으로 간주하여 재멸균한다."],
      ["감염 사슬(chain of infection)의 구성 요소가 아닌 것은?", "병원체|저장소|감수성 숙주|항생제", 3, "감염 사슬은 병원체, 저장소, 탈출구, 전파경로, 침입구, 감수성 숙주 6가지로 구성된다."],
      ["개인 보호구 착용 순서로 옳은 것은?", "가운→마스크→고글→장갑|마스크→고글→장갑→가운|장갑→가운→마스크→고글|고글→장갑→가운→마스크", 0, "착용 순서는 가운→마스크→고글(안면보호구)→장갑이다."],
      ["개인 보호구 제거 순서로 옳은 것은?", "마스크→장갑→고글→가운|장갑→고글→가운→마스크|가운→마스크→장갑→고글|장갑→가운→고글→마스크", 1, "제거 순서는 장갑→고글(안면보호구)→가운→마스크이다."],
      ["E.O. 가스 멸균의 특징으로 옳은 것은?", "고온에서 시행한다|열에 약한 물품에 적합하다|멸균 시간이 매우 짧다|잔류 가스가 없다", 1, "E.O.(에틸렌옥사이드) 가스 멸균은 저온 멸균법으로 열에 약한 물품에 적합하다."],
      ["무균술의 원칙으로 옳지 않은 것은?", "멸균 물품은 멸균 물품끼리 접촉한다|멸균 영역은 허리 이상 높이에서 관리한다|오염이 의심되면 멸균으로 간주한다|멸균포 가장자리 2.5cm는 오염 영역이다", 2, "오염이 의심되면 오염된 것으로 간주해야 하며, 멸균으로 간주하는 것은 잘못이다."],
      ["의료폐기물 중 손상성 폐기물의 처리 용기 색상은?", "빨간색|노란색|녹색|파란색", 1, "손상성 폐기물(주사바늘 등)은 노란색 전용 용기에 수거한다."],
      ["병원 감염(HAI)의 정의로 옳은 것은?", "입원 당시 이미 있던 감염|입원 48시간 이후 발생한 감염|외래 진료 시 발생한 감염|수술 전 발생한 감염", 1, "병원 감염은 입원 당시에는 없었으나 입원 48시간(또는 72시간) 이후 발생한 감염이다."],
      ["주사바늘 찔림 사고 예방법으로 옳은 것은?", "사용한 주사바늘을 다시 뚜껑에 끼운다|사용 즉시 손상성 폐기물 전용 용기에 버린다|주사바늘을 손으로 구부린 후 버린다|폐기 용기가 가득 차면 버린다", 1, "사용한 주사바늘은 리캡하지 않고 즉시 전용 용기에 폐기한다."],
      ["소독 수준 중 높은 수준의 소독에 해당하는 것은?", "비누와 물로 세척|알코올로 닦기|글루타르알데히드 소독|자외선 소독", 2, "글루타르알데히드는 높은 수준의 소독제로 아포를 제외한 대부분의 미생물을 제거한다."],
      ["멸균 장갑 벗는 방법으로 옳은 것은?", "손목 부위를 잡고 뒤집어 벗는다|장갑 바깥면을 잡고 그대로 벗는다|손가락 부위를 잡고 벗는다|가위로 잘라서 벗는다", 0, "한쪽 장갑의 바깥면(오염면)을 잡고 뒤집어 벗은 후, 나머지 장갑은 안쪽(청결면)에 손가락을 넣어 뒤집어 벗는다."],
      ["감염관리에서 '코호트 격리'란?", "감염 환자를 1인실에 격리하는 것|같은 병원체 감염 환자를 같은 공간에 배치하는 것|의료진을 격리하는 것|보호자를 격리하는 것", 1, "코호트 격리는 같은 병원체에 감염된 환자들을 같은 구역에 배치하는 방법이다."],
      ["소독제 사용 시 주의사항으로 옳지 않은 것은?", "적절한 농도를 유지한다|유효 기간을 확인한다|서로 다른 소독제를 혼합하여 효과를 높인다|유기물 제거 후 소독한다", 2, "소독제를 혼합하면 유해가스가 발생하거나 효과가 감소할 수 있으므로 혼합하지 않는다."],
      ["역격리(protective isolation)가 필요한 환자는?", "결핵 환자|MRSA 감염 환자|면역억제 환자|인플루엔자 환자", 2, "역격리(보호격리)는 면역력이 저하된 환자를 외부 감염으로부터 보호하기 위해 시행한다."],
      ["외과적 손씻기(surgical hand scrub) 시간으로 옳은 것은?", "1~2분|3~5분|7~10분|15~20분", 1, "외과적 손씻기는 3~5분간 시행한다."],
      ["멸균 물품 보관 원칙으로 옳지 않은 것은?", "건조한 곳에 보관한다|바닥에서 20~25cm 이상 높이에 보관한다|천장에서 최소 45cm 떨어진 곳에 보관한다|습한 곳에 보관하면 보존 기간이 연장된다", 3, "습한 곳에 보관하면 포장이 젖어 오염될 수 있으므로 건조한 곳에 보관해야 한다."]
    ]
  },
  "06": {
    t: "검사 돕기",
    q: [
      ["공복 혈당 검사 시 금식 시간으로 적절한 것은?", "2~4시간|4~6시간|8~12시간|14~16시간", 2, "공복 혈당 검사는 최소 8~12시간 금식 후 시행한다."],
      ["혈액 검사 시 채혈 부위로 가장 흔히 사용하는 정맥은?", "경정맥|전주정맥|대퇴정맥|손등 정맥", 1, "전주정맥(antecubital vein)이 채혈 시 가장 흔히 사용된다."],
      ["채혈 시 지혈대(tourniquet) 적용 시간으로 적절한 것은?", "30초 이내|1분 이내|3분 이내|5분 이내", 1, "지혈대는 1분 이내로 적용하며, 오래 적용하면 혈액 성분이 변할 수 있다."],
      ["소변 검사 시 중간뇨(midstream urine)를 채취하는 이유는?", "검사량이 충분하도록|요도 주위 세균 오염을 줄이기 위해|검사 시간을 단축하기 위해|소변의 농도를 높이기 위해", 1, "처음과 마지막 소변을 버리고 중간뇨를 받아 요도 주변 세균에 의한 오염을 최소화한다."],
      ["24시간 소변 검사 시 첫 소변 처리법으로 옳은 것은?", "수집 용기에 넣는다|버린다|별도 검체로 보관한다|냉장 보관한다", 1, "24시간 소변 수집 시 첫 소변은 버리고 그 이후부터 다음 날 같은 시간까지 모은다."],
      ["대변 잠혈 검사(FOBT) 전 금지해야 하는 음식은?", "채소류|유제품|붉은 고기(적색육)|곡류", 2, "붉은 고기에 포함된 헤모글로빈이 위양성을 유발할 수 있어 검사 전 금지한다."],
      ["요추 천자(lumbar puncture) 시 환자의 적절한 체위는?", "반좌위|복위|측위에서 새우등 자세|앙와위", 2, "요추 천자 시 측위에서 무릎을 가슴 쪽으로 당기는 새우등 자세를 취한다."],
      ["요추 천자 후 간호로 옳은 것은?", "즉시 보행한다|4~8시간 앙와위를 유지한다|좌위를 취한다|관장을 시행한다", 1, "요추 천자 후 뇌척수액 누출과 두통 예방을 위해 4~8시간 앙와위를 유지한다."],
      ["혈액 배양 검사 채혈 시기로 가장 적절한 것은?", "항생제 투여 후|해열 후|오한 발생 시(체온 상승기)|안정 시", 2, "혈액 배양 검사는 항생제 투여 전, 오한이 나기 시작할 때 채혈하는 것이 가장 좋다."],
      ["혈당 측정 시 모세혈관 채혈 부위로 적절한 곳은?", "손가락 끝 중앙|손가락 끝 측면|손바닥 중앙|손등", 1, "손가락 끝 측면이 통증이 적고 혈액 공급이 풍부하여 적절하다."],
      ["객담 검사 시 가장 좋은 채취 시간은?", "식후|취침 전|이른 아침 기상 직후|운동 후", 2, "이른 아침 기상 직후에 객담이 농축되어 있어 검사에 적합하다."],
      ["소변 검체를 즉시 검사실로 보내지 못할 때 보관 방법은?", "상온에 보관한다|냉장 보관한다|냉동 보관한다|37°C에 보관한다", 1, "소변 검체는 세균 증식을 방지하기 위해 냉장(4°C) 보관한다."],
      ["혈액가스분석(ABGA) 채혈 부위로 가장 흔히 사용하는 동맥은?", "상완동맥|대퇴동맥|요골동맥|경동맥", 2, "요골동맥이 ABGA 채혈 시 가장 흔히 사용되며, Allen 검사 후 시행한다."],
      ["Allen 검사의 목적은?", "정맥 상태 확인|요골·척골동맥의 측부순환 확인|출혈 경향 확인|감염 유무 확인", 1, "Allen 검사는 요골동맥 천자 전 척골동맥의 측부순환이 적절한지 확인하는 검사이다."],
      ["혈액 검사용 채혈 시 채혈관의 올바른 순서로 첫 번째는?", "EDTA(보라색)|혈액 배양(노란색)|SST(빨간색)|구연산나트륨(파란색)", 1, "혈액 배양 검체가 가장 먼저이며, 오염 방지를 위해 우선 채혈한다."],
      ["생검(biopsy) 후 간호로 적절하지 않은 것은?", "출혈 여부를 관찰한다|압박 드레싱을 한다|즉시 격렬한 운동을 허용한다|활력 징후를 측정한다", 2, "생검 후에는 출혈 예방을 위해 안정을 취하고 격렬한 운동은 금지한다."],
      ["간 생검 후 환자의 적절한 체위는?", "좌측위|우측위|복위|좌위", 1, "간 생검 후 출혈 방지를 위해 우측위를 취하여 간 부위를 압박한다."],
      ["소변 검사에서 정상 pH 범위는?", "2.0~4.0|4.5~8.0|8.5~10.0|10.0~12.0", 1, "정상 소변 pH는 4.5~8.0이며, 평균 약 6.0이다."],
      ["정상 성인의 공복 혈당 범위로 옳은 것은?", "50~70mg/dL|70~100mg/dL|100~126mg/dL|126~150mg/dL", 1, "정상 공복 혈당은 70~100mg/dL이다."],
      ["혈액검사에서 CBC가 의미하는 것은?", "혈액 화학 검사|전혈구 계산|혈액 응고 검사|혈액 가스 분석", 1, "CBC(Complete Blood Count)는 전혈구 계산으로 적혈구, 백혈구, 혈소판 등을 측정한다."],
      ["PT(프로트롬빈 시간) 검사의 목적은?", "빈혈 진단|혈액 응고 기능 평가|감염 확인|전해질 균형 확인", 1, "PT는 외인성 응고 경로를 평가하여 혈액 응고 기능을 확인하는 검사이다."],
      ["소변 검사에서 단백뇨가 나타나는 경우로 옳은 것은?", "과일을 많이 섭취했을 때|격렬한 운동 후|과도한 수분 섭취 시|탄수화물 과다 섭취 시", 1, "격렬한 운동, 발열, 신장 질환 등에서 단백뇨가 나타날 수 있다."],
      ["골수 천자(bone marrow aspiration) 부위로 가장 흔한 곳은?", "대퇴골|경골|후장골능(posterior iliac crest)|쇄골", 2, "성인에서 골수 천자는 후장골능에서 가장 흔히 시행한다."],
      ["흉수 천자(thoracentesis) 시 환자의 적절한 체위는?", "앙와위|좌위에서 앞으로 기대는 자세|복위|측위", 1, "흉수 천자 시 환자는 좌위에서 침상 테이블에 팔을 올리고 앞으로 기대는 자세를 취한다."],
      ["혈액 검사 결과에서 정상 헤모글로빈 수치(성인 남성)로 옳은 것은?", "8~10g/dL|10~12g/dL|13~17g/dL|18~22g/dL", 2, "성인 남성의 정상 헤모글로빈은 13~17g/dL이다."],
      ["정상 백혈구(WBC) 수치 범위로 옳은 것은?", "1,000~3,000/μL|4,000~10,000/μL|12,000~15,000/μL|15,000~20,000/μL", 1, "정상 백혈구 수치는 4,000~10,000/μL이다."],
      ["채혈 후 지혈 방법으로 옳은 것은?", "채혈 부위를 문지른다|채혈 부위를 3~5분간 압박한다|채혈 부위를 소독한다|채혈 부위를 냉찜질한다", 1, "채혈 후 멸균 솜으로 채혈 부위를 3~5분간 압박하여 지혈한다."],
      ["검체 용기에 반드시 표기해야 할 사항으로 거리가 먼 것은?", "환자 이름|채취 날짜와 시간|검체 종류|환자의 보험 정보", 3, "검체 용기에는 환자 이름, 등록번호, 채취 날짜·시간, 검체 종류 등을 표기하며 보험 정보는 해당되지 않는다."],
      ["대변 검체 채취 시 주의사항으로 옳은 것은?", "소변이 섞여도 무방하다|대변 표면과 내부에서 채취한다|변기 물에 담가서 채취한다|검체량은 최소한만 채취한다", 1, "대변 검체는 대변의 표면과 내부 여러 부위에서 채취하며, 소변이나 물이 섞이지 않도록 한다."],
      ["혈중 약물 농도(trough level) 채혈 시기는?", "약물 투여 직후|약물 투여 30분 후|다음 약물 투여 직전|약물 투여 1시간 후", 2, "최저 혈중 농도(trough level)는 다음 약물 투여 직전에 채혈한다."]
    ]
  },
  "07": {
    t: "침대 만들기 돕기",
    q: [
      ["개방 침상(open bed)의 특징으로 옳은 것은?", "퇴원 후 사용하는 침상이다|입원 중인 환자가 잠시 자리를 비울 때 만드는 침상이다|수술 후 환자를 위한 침상이다|사용하지 않는 빈 침상이다", 1, "개방 침상은 입원 중인 환자가 일시적으로 침대를 벗어났을 때 윗 시트를 부채꼴로 접어놓은 침상이다."],
      ["폐쇄 침상(closed bed)의 특징으로 옳은 것은?", "윗 시트를 부채꼴로 접어놓은 침상이다|입원 환자가 없는 빈 침상이다|수술 후 환자를 위한 침상이다|회음부 간호를 위한 침상이다", 1, "폐쇄 침상은 새 환자를 받기 전 빈 침상을 만드는 것으로 윗 시트를 침대 위에 펼쳐놓는다."],
      ["수술 후 침상(surgical bed/recovery bed)의 특징으로 옳은 것은?", "윗 시트를 단단히 당겨 넣는다|윗 시트를 한쪽으로 부채꼴로 접어 환자 이동이 용이하게 한다|베개를 2개 놓는다|시트를 교환하지 않는다", 1, "수술 후 침상은 환자를 침대로 쉽게 옮길 수 있도록 윗 시트를 한쪽으로 부채꼴로 접거나 세로로 접어 준비한다."],
      ["침상 만들기 시 모서리를 접는 방법의 이름은?", "봉투 접기(mitered corner)|부채꼴 접기|삼각 접기|평접기", 0, "모서리를 깔끔하게 접는 봉투 접기(mitered corner)를 사용하여 시트를 고정한다."],
      ["린넨 교환 시 사용한 린넨의 처리 방법으로 옳은 것은?", "바닥에 놓는다|환자 침대 위에 놓는다|린넨 수거함에 넣는다|흔들어서 먼지를 턴다", 2, "사용한 린넨은 흔들지 않고 돌돌 말아 린넨 수거함에 넣어 미생물 비산을 방지한다."],
      ["와상 환자의 린넨 교환 시 적절한 방법은?", "환자를 침대에서 내린 후 교환한다|환자를 측위로 돌리면서 반씩 교환한다|보호자에게 안아주도록 한다|린넨 교환을 하지 않는다", 1, "와상 환자는 한쪽으로 돌려 눕힌 후 반쪽씩 린넨을 교환한다."],
      ["방수포(draw sheet)의 위치로 올바른 것은?", "베개 아래|환자의 어깨부터 무릎까지|환자의 발 아래|침대 전체", 1, "방수포는 환자의 어깨부터 무릎까지 놓아 체액 오염으로부터 매트리스를 보호한다."],
      ["침상 만들기 시 시트를 팽팽하게 펴야 하는 이유는?", "미관을 위해|욕창 예방을 위해|환자 체온 유지를 위해|감염 예방을 위해", 1, "시트 주름은 피부에 압력을 가하여 욕창을 유발할 수 있으므로 팽팽하게 펴야 한다."],
      ["침상 만들기에서 밑시트(bottom sheet)를 넣는 방법으로 옳은 것은?", "시트를 느슨하게 놓는다|시트를 매트리스 아래로 단단히 넣어 고정한다|시트를 반만 넣는다|시트를 테이프로 고정한다", 1, "밑시트는 매트리스 아래로 단단히 넣어 주름이 생기지 않도록 고정한다."],
      ["침대 만들기 시 신체 역학 원칙으로 옳은 것은?", "허리를 구부려 작업한다|침대 높이를 작업자 허리 높이로 조절한다|한쪽에서 모든 작업을 한다|양발을 모아 선다", 1, "신체 역학 원칙에 따라 침대 높이를 작업자 허리 높이로 조절하여 요통을 예방한다."],
      ["베개의 적절한 위치로 옳은 것은?", "어깨 아래|머리와 목을 지지하는 위치|등 뒤|무릎 아래", 1, "베개는 머리와 목을 적절히 지지하는 위치에 놓아야 한다."],
      ["침상 린넨의 교환 주기로 적절한 것은?", "일주일에 1회|오염 시 즉시 및 정기적으로|퇴원 시에만|월 1회", 1, "린넨은 오염 시 즉시 교환하고, 정기적으로(일반적으로 매일 또는 격일) 교환한다."],
      ["침상 만들기 시 표준주의를 적용해야 하는 경우는?", "감염 환자만|혈액 오염 시에만|모든 경우|의사 지시 시에만", 2, "표준주의는 모든 환자에게 적용하므로 린넨 교환 시에도 항상 적용한다."],
      ["수술 후 침상에서 핫워터 백(hot water bag)을 준비하는 이유는?", "침상 소독|환자의 체온 유지|통증 완화|감염 예방", 1, "수술 후 마취에서 회복하는 환자의 체온 유지를 위해 핫워터 백을 준비한다."],
      ["침대 만들기 시 감염 예방을 위한 원칙으로 옳지 않은 것은?", "깨끗한 린넨은 오염된 표면에 놓지 않는다|사용한 린넨은 흔들어 먼지를 턴다|장갑을 착용한다|린넨은 몸에서 멀리 들고 운반한다", 1, "사용한 린넨을 흔들면 미생물이 공기 중으로 비산되므로 흔들지 않는다."],
      ["견인(traction) 환자의 침상에서 주의할 사항은?", "매일 침상 전체를 교환한다|견인 장치를 풀고 교환한다|견인 장치를 유지하면서 교환한다|침상 교환을 하지 않는다", 2, "견인 환자는 견인 장치를 유지한 상태에서 린넨을 교환해야 한다."],
      ["요람(cradle)의 사용 목적은?", "환자를 따뜻하게 하기 위해|침구의 무게로부터 신체 부위를 보호하기 위해|낙상을 예방하기 위해|체위를 유지하기 위해", 1, "요람은 침구의 무게가 손상 부위나 민감한 부위에 가해지지 않도록 보호한다."],
      ["침상에서 풋보드(footboard)의 목적은?", "낙상 방지|족하수 예방|욕창 예방|보온 유지", 1, "풋보드는 발이 바깥으로 처지는 족하수(foot drop)를 예방한다."],
      ["침상 매트리스의 관리로 적절한 것은?", "물로 자주 세탁한다|정기적으로 뒤집거나 회전시킨다|항상 같은 면을 사용한다|환자 퇴원 후에도 교환하지 않는다", 1, "매트리스는 정기적으로 뒤집거나 회전시켜 변형을 방지하고 균일한 지지력을 유지한다."],
      ["에그 크레이트 매트리스(egg crate mattress)의 사용 목적은?", "침대 높이 조절|욕창 예방을 위한 압력 분산|보온 유지|감염 예방", 1, "에그 크레이트 매트리스는 신체 접촉면의 압력을 분산시켜 욕창을 예방한다."],
      ["침상 만들기 시 밑시트 위에 까는 방수포의 목적은?", "환자 보온|매트리스 오염 방지|시트 미끄럼 방지|환자 낙상 방지", 1, "방수포는 체액이나 배설물로부터 매트리스의 오염을 방지한다."],
      ["개방 침상을 만들 때 윗 시트를 접는 방향은?", "머리 쪽으로 접는다|발 쪽으로 부채꼴로 접는다|좌측으로 접는다|접지 않고 그대로 둔다", 1, "개방 침상은 환자가 쉽게 들어갈 수 있도록 윗 시트를 발 쪽으로 부채꼴로 접어놓는다."],
      ["침상에서 환자의 안위를 위해 확인해야 할 사항으로 거리가 먼 것은?", "시트의 주름 유무|침대 난간 상태|린넨의 가격|베개의 높이", 2, "린넨의 가격은 환자의 안위와 관련이 없다."],
      ["침대 높이를 낮추어야 하는 시점은?", "침상 만들기 중|환자가 침대에 있을 때|린넨 교환 시|청소 시", 1, "환자가 침대에 있을 때는 낙상 예방을 위해 침대 높이를 낮추어야 한다."],
      ["침상 보조 기구 중 트로칸터 롤(trochanter roll)의 목적은?", "족하수 예방|고관절 외회전 방지|손 기능 유지|등 지지", 1, "트로칸터 롤은 대전자 옆에 놓아 고관절의 외회전을 방지한다."],
      ["핸드 롤(hand roll)의 목적은?", "손의 기능적 위치 유지|손목 운동|손가락 신전|손목 굴곡 방지", 0, "핸드 롤은 손이 기능적 위치(약간 굴곡)를 유지하도록 돕는다."],
      ["침상에서 사이드 레일(side rail)의 사용 목적은?", "체위 유지|낙상 방지|욕창 예방|보온 유지", 1, "사이드 레일(침대 난간)은 환자의 낙상을 방지하기 위해 사용한다."],
      ["와상 환자의 체위 변경 주기로 적절한 것은?", "30분마다|2시간마다|4시간마다|6시간마다", 1, "욕창 예방을 위해 와상 환자는 2시간마다 체위를 변경한다."],
      ["침상 만들기 시 린넨을 준비하는 원칙으로 옳은 것은?", "사용할 순서의 역순으로 쌓는다|사용할 순서대로 쌓는다|종류별로 분리한다|무게 순서로 쌓는다", 0, "린넨은 사용할 순서의 역순으로 쌓아 위에서부터 순서대로 사용할 수 있게 한다."],
      ["침상 환경에서 사용되는 담요의 관리로 적절한 것은?", "매일 세탁한다|환자 간 공유하여 사용한다|환자 전용으로 사용하고 퇴원 시 세탁한다|세탁 없이 재사용한다", 2, "담요는 환자 전용으로 사용하고, 오염 시 즉시 또는 환자 퇴원 시 세탁한다."]
    ]
  },
  "08": {
    t: "개인위생 돕기",
    q: [
      ["의식이 없는 환자의 구강 간호 시 적절한 체위는?", "앙와위|측위(얼굴을 옆으로)|좌위|복위", 1, "의식이 없는 환자는 흡인을 예방하기 위해 측위로 눕히고 얼굴을 옆으로 돌린 후 구강 간호를 한다."],
      ["의식이 없는 환자의 구강 간호 시 사용하는 도구는?", "일반 칫솔|설압자에 거즈를 감은 것|전동 칫솔|구강 양치액만 사용", 1, "의식이 없는 환자는 설압자에 거즈를 감아 구강 간호를 시행한다."],
      ["침상 목욕 시 물의 적정 온도는?", "30~35°C|40~43°C|45~48°C|50~55°C", 1, "침상 목욕 시 물 온도는 40~43°C가 적절하다."],
      ["침상 목욕의 순서로 옳은 것은?", "사지→얼굴→몸통→회음부|얼굴→상지→몸통→하지→회음부|회음부→얼굴→사지→몸통|몸통→사지→얼굴→회음부", 1, "침상 목욕은 깨끗한 부위에서 오염된 부위 순으로 얼굴→상지→몸통→하지→회음부 순서로 시행한다."],
      ["등 간호(back care)의 목적으로 거리가 먼 것은?", "혈액순환 촉진|피부 상태 관찰|욕창 예방|혈당 조절", 3, "등 간호의 목적은 혈액순환 촉진, 피부 상태 관찰, 욕창 예방, 근육 이완 등이며 혈당 조절과는 관련이 없다."],
      ["회음부 간호 시 닦는 방향으로 옳은 것은?", "회음부에서 항문 방향으로|항문에서 회음부 방향으로|좌에서 우로|우에서 좌로", 0, "요도 감염 예방을 위해 회음부(깨끗한 부위)에서 항문(오염된 부위) 방향으로 닦는다."],
      ["의치(틀니) 관리로 옳은 것은?", "열탕 소독한다|뜨거운 물에 보관한다|찬물이나 미지근한 물에 보관한다|마른 상태로 보관한다", 2, "의치는 뜨거운 물에 넣으면 변형될 수 있으므로 찬물이나 미지근한 물에 보관한다."],
      ["침상에서 머리 감기기 시 환자의 적절한 체위는?", "복위|좌위|앙와위에서 머리를 침대 가장자리로|측위", 2, "침상에서 머리를 감길 때는 앙와위에서 머리를 침대 가장자리 쪽으로 놓는다."],
      ["손톱·발톱 관리 시 적절한 방법은?", "둥글게 깎는다|일자로 깎는다|바짝 짧게 깎는다|뾰족하게 깎는다", 1, "발톱은 내향성 발톱(ingrown nail) 예방을 위해 일자로 깎는다."],
      ["당뇨병 환자의 발 관리로 적절하지 않은 것은?", "매일 발을 관찰한다|발톱을 일자로 깎는다|발가락 사이를 잘 건조시킨다|티눈이나 굳은살을 칼로 직접 제거한다", 3, "당뇨 환자는 상처 치유가 지연되므로 티눈이나 굳은살을 칼로 직접 제거하면 안 된다."],
      ["침상 목욕 시 워시클로스(washcloth) 사용법으로 옳은 것은?", "한 면으로 계속 닦는다|한 번 닦을 때마다 면을 바꾸어 사용한다|비누를 묻히지 않고 사용한다|뜨거운 물에 담갔다가 사용한다", 1, "한 번 닦을 때마다 워시클로스의 면을 바꾸어 사용하여 교차오염을 방지한다."],
      ["눈 간호 시 닦는 방향으로 옳은 것은?", "아래에서 위로|위에서 아래로|내안각에서 외안각으로|외안각에서 내안각으로", 2, "눈은 내안각(안쪽)에서 외안각(바깥쪽)으로 닦아 분비물이 비루관으로 역류하는 것을 방지한다."],
      ["구강 간호 시 칫솔질 방향으로 옳은 것은?", "좌우로 강하게|잇몸에서 치아 방향으로|치아에서 잇몸 방향으로|원형으로만", 1, "잇몸에서 치아 방향(위 잇몸은 아래로, 아래 잇몸은 위로)으로 닦아 잇몸 손상을 예방한다."],
      ["침상 목욕 시 비누 사용을 피해야 하는 부위는?", "팔|다리|얼굴과 눈 주위|발", 2, "얼굴과 눈 주위는 점막이 민감하여 비누 사용을 피하고 물로만 닦는다."],
      ["샴푸 시 두피 마사지의 방법으로 옳은 것은?", "손톱으로 긁는다|손가락 끝(지문 부위)으로 마사지한다|수건으로 문지른다|빗으로 긁어준다", 1, "두피를 손가락 끝(지문 부위)으로 부드럽게 원을 그리며 마사지한다."],
      ["회음부 간호가 특히 필요한 환자로 거리가 먼 것은?", "유치도뇨관 삽입 환자|질 분비물이 있는 환자|시력 저하 환자|대소변 실금 환자", 2, "시력 저하는 회음부 간호의 직접적 적응증이 아니다."],
      ["침상 목욕 시 환자의 프라이버시 보호를 위한 방법은?", "모든 린넨을 제거한다|목욕 담요로 노출을 최소화한다|커튼을 열어둔다|보호자를 불러온다", 1, "목욕 담요를 사용하여 닦는 부위만 노출하고 나머지는 덮어 프라이버시를 보호한다."],
      ["등 마사지 시 적절한 방법은?", "뼈 위를 세게 누른다|척추를 직접 마사지한다|원형으로 부드럽게 마사지한다|5초 이내로 빠르게 마사지한다", 2, "등 마사지는 척추 양옆 근육 부위를 원형으로 부드럽게 마사지한다."],
      ["오전 간호(AM care)에 포함되지 않는 것은?", "세면|구강 간호|침상 정리|수술 전 피부 준비", 3, "오전 간호에는 세면, 구강 간호, 침상 정리, 활력 징후 측정 등이 포함되며 수술 전 피부 준비는 별도의 처치이다."],
      ["취침 전 간호(HS care)에 포함되는 것은?", "수술 부위 소독|구강 간호 및 세면|혈액 검사|관장", 1, "취침 전 간호에는 구강 간호, 세면, 등 마사지, 침상 정리, 배뇨 유도 등이 포함된다."],
      ["침상 목욕 시 사지를 닦는 방향으로 옳은 것은?", "근위부에서 원위부로|원위부에서 근위부로|좌에서 우로|위에서 아래로만", 1, "사지는 원위부에서 근위부(말단에서 심장 방향) 방향으로 닦아 정맥 환류를 촉진한다."],
      ["좌욕(sitz bath)의 물 온도로 적절한 것은?", "30~35°C|37.7~40.5°C|43~46°C|48~50°C", 1, "좌욕의 물 온도는 37.7~40.5°C(약 38~41°C)가 적절하다."],
      ["좌욕의 적응증으로 거리가 먼 것은?", "치질 수술 후|회음부 절개 후|회음부 통증|상지 골절", 3, "좌욕은 회음부 관련 문제(치질, 회음절개 등)에 적용하며 상지 골절과는 관련이 없다."],
      ["머리 빗질 시 적절한 방법은?", "위에서 아래로 한 번에 빗는다|모발 끝부터 시작하여 위쪽으로 올라간다|두피에서 강하게 빗는다|젖은 상태에서 세게 빗는다", 1, "엉킨 머리는 모발 끝부터 풀어가며 점차 위쪽으로 올라가면서 빗는다."],
      ["욕창 호발 부위가 아닌 것은?", "천골|발뒤꿈치|후두부|전완 내측", 3, "전완 내측은 뼈 돌출 부위가 아니므로 욕창 호발 부위가 아니다. 천골, 발뒤꿈치, 후두부 등 뼈 돌출 부위에 호발한다."],
      ["침상 목욕 후 피부에 로션을 바르는 이유는?", "피부 감염 예방|피부 건조 예방과 보호|체온 유지|냄새 제거", 1, "목욕 후 로션을 발라 피부 건조를 예방하고 피부를 보호한다."],
      ["구강 간호 시 사용하는 용액으로 적절한 것은?", "과산화수소 원액|알코올|생리식염수 또는 구강 세정액|포비돈 요오드", 2, "구강 간호에는 생리식염수나 구강 세정액을 사용한다."],
      ["개인위생 간호의 목적으로 거리가 먼 것은?", "감염 예방|안위 증진|피부 상태 관찰|혈액 검사 준비", 3, "개인위생 간호의 목적은 감염 예방, 안위 증진, 피부 상태 관찰, 자존감 유지 등이며 혈액 검사 준비와는 관련이 없다."],
      ["면도 간호 시 항응고제를 복용하는 환자에게 적절한 면도기는?", "일반 면도날|안전면도기|전기면도기|일회용 면도기", 2, "항응고제 복용 환자는 출혈 위험이 높으므로 피부 손상이 적은 전기면도기를 사용한다."]
    ]
  },
"09": {
    t: "식사 돕기",
    q: [
      ["비위관(L-tube) 삽입 시 적절한 길이를 측정하는 방법은?", "코끝→귓불→배꼽|코끝→귓불→검상돌기|코끝→턱→검상돌기|코끝→이마→검상돌기", 1, "비위관 삽입 길이는 코끝에서 귓불을 지나 검상돌기까지의 거리(약 50cm)로 측정한다."],
      ["비위관 삽입 시 위 내 위치를 확인하는 방법으로 적절하지 않은 것은?", "주사기로 위 내용물을 흡인한다|흡인물의 pH를 확인한다|청진기로 공기 주입 소리를 확인한다|관 끝을 물에 담가 기포가 나오면 위에 위치한 것이다", 3, "관 끝을 물에 담가 기포가 나오면 기관에 삽입된 것이므로 즉시 제거해야 한다."],
      ["경관영양(tube feeding) 시 적절한 체위는?", "앙와위|좌측위|반좌위(30~45도)|복위", 2, "경관영양 시 흡인(aspiration) 예방을 위해 반좌위(30~45도)를 취해주고, 주입 후 30~60분간 유지한다."],
      ["경관영양 주입 전 잔여량(residual volume)이 얼마 이상이면 주입을 보류하는가?", "50mL|100mL|150mL 이상 또는 이전 주입량의 반 이상|300mL", 2, "잔여량이 150mL 이상이거나 이전 주입량의 50% 이상이면 주입을 보류하고 의사에게 보고한다."],
      ["경관영양 시 영양액의 적절한 온도는?", "냉장 온도(4°C)|실온 또는 체온 정도|50°C|60°C", 1, "영양액은 실온 또는 체온 정도(37°C)가 적절하며, 차가운 영양액은 복부경련과 설사를 유발할 수 있다."],
      ["비위관 삽입 시 대상자에게 취하도록 하는 체위는?", "앙와위|반좌위 또는 고파울러위|측위|트렌델렌버그 체위", 1, "비위관 삽입 시 반좌위 또는 고파울러위(60~90도)를 취하여 흡인을 예방한다."],
      ["비위관 삽입 시 관이 후두 부위를 통과할 때 대상자에게 하도록 하는 행위는?", "심호흡을 한다|고개를 뒤로 젖힌다|침을 삼키거나 물을 마신다|기침을 한다", 2, "삼키는 동작은 후두개를 닫아 관이 식도로 들어가도록 돕는다."],
      ["다음 중 고단백 식이가 필요한 대상자는?", "신부전 환자|간성 혼수 환자|화상 환자|통풍 환자", 2, "화상 환자는 조직 재생과 상처 치유를 위해 고단백 식이가 필요하다."],
      ["연하곤란(dysphagia) 환자의 식사 간호로 적절한 것은?", "묽은 물을 먼저 제공한다|고개를 뒤로 젖히고 먹게 한다|걸쭉한 음식(thickened fluid)을 제공한다|앙와위에서 먹게 한다", 2, "연하곤란 환자에게는 걸쭉한 음식을 제공하고, 고개를 약간 앞으로 숙이게 하여 흡인을 예방한다."],
      ["저잔여식이(low-residue diet)가 적합한 대상자는?", "변비 환자|대장 수술 전 환자|당뇨병 환자|빈혈 환자", 1, "저잔여식이는 대장 수술 전후, 장 폐색, 크론병 급성기 등에 적용하여 장의 부담을 줄인다."],
      ["당뇨 환자의 식이 교육 내용으로 적절한 것은?", "식사를 거르고 한 번에 많이 먹는다|규칙적인 식사와 간식을 섭취한다|단백질 섭취를 제한한다|과일은 제한 없이 먹어도 된다", 1, "당뇨 환자는 규칙적인 식사와 간식을 통해 혈당 변동을 최소화해야 한다."],
      ["총비경구영양(TPN) 주입 시 간호로 옳은 것은?", "말초정맥으로 주입한다|주입 속도를 갑자기 변경해도 된다|혈당을 정기적으로 모니터링한다|무균술은 필요하지 않다", 2, "TPN은 고농도 포도당을 포함하므로 고혈당 위험이 있어 혈당을 정기적으로 모니터링해야 한다."],
      ["경관영양 주입 후 관을 세척하는 용액과 양으로 적절한 것은?", "생리식염수 100mL|미지근한 물 30~50mL|소독수 20mL|증류수 100mL", 1, "주입 후 미지근한 물 30~50mL로 관을 세척하여 막힘을 예방하고 남은 영양액을 위로 밀어 넣는다."],
      ["BMI(체질량지수) 계산 공식으로 옳은 것은?", "체중(kg) ÷ 신장(m)|체중(kg) ÷ 신장(m)²|신장(cm) ÷ 체중(kg)|체중(kg) × 신장(m)²", 1, "BMI = 체중(kg) ÷ 신장(m)²이며, 18.5~24.9가 정상 범위이다."],
      ["영양불량 환자를 사정할 때 가장 유용한 혈액검사 지표는?", "혈색소(Hb)|혈청 알부민(serum albumin)|혈당(blood glucose)|BUN", 1, "혈청 알부민은 단백질 영양 상태를 반영하는 대표적 지표로, 3.5g/dL 미만이면 영양불량을 의심한다."],
      ["저나트륨 식이가 필요한 대상자는?", "설사 환자|심부전 환자|화상 환자|빈혈 환자", 1, "심부전 환자는 체액 저류와 부종을 예방하기 위해 저나트륨 식이를 적용한다."],
      ["비위관 삽입 시 코에서 인두까지 관을 넣을 때 대상자의 머리 위치는?", "뒤로 젖힌다(과신전)|앞으로 숙인다(굴곡)|옆으로 돌린다|정면을 유지한다", 0, "코에서 인두까지는 머리를 뒤로 젖혀 관이 비강을 통과하기 쉽게 하고, 인두 통과 후에는 턱을 가슴 쪽으로 숙인다."],
      ["경관영양 시 설사가 발생했을 때 적절한 간호 중재는?", "영양액 주입 속도를 높인다|영양액 농도를 낮추거나 주입 속도를 줄인다|영양액 온도를 낮춘다|체위를 앙와위로 변경한다", 1, "설사 발생 시 주입 속도를 줄이거나 농도를 낮추고, 영양액 오염 여부도 확인한다."],
      ["고칼륨혈증 환자에게 제한해야 하는 식품은?", "쌀밥|바나나|두부|식빵", 1, "바나나, 오렌지, 감자, 시금치 등은 칼륨이 높은 식품으로 고칼륨혈증 시 제한해야 한다."],
      ["무의식 환자의 구강간호 시 적절한 체위는?", "앙와위|반좌위|측위|복위", 2, "무의식 환자는 측위를 취해 구강 내 액체가 중력에 의해 입 밖으로 흘러나오게 하여 흡인을 예방한다."],
      ["간성 혼수 환자의 식이 원칙으로 옳은 것은?", "고단백 식이를 제공한다|단백질을 제한한다|저탄수화물 식이를 제공한다|나트륨 섭취를 증가시킨다", 1, "간성 혼수 환자는 암모니아 축적을 방지하기 위해 단백질을 제한한다."],
      ["경관영양 합병증 중 흡인(aspiration)을 예방하기 위한 간호로 옳은 것은?", "앙와위를 유지한다|주입 속도를 빠르게 한다|주입 후 최소 30분간 상체를 올린다|비위관 위치 확인은 불필요하다", 2, "흡인 예방을 위해 주입 중과 후 30~60분간 상체를 30~45도 올린 체위를 유지한다."],
      ["위루술(gastrostomy) 환자 간호로 적절한 것은?", "위루관 주위 피부를 매일 세척한다|위루관은 고정하지 않는다|영양액 주입 시 앙와위를 취한다|위루관 삽입 부위는 소독하지 않는다", 0, "위루관 주위 피부를 매일 세척하고 건조시키며, 피부 손상 유무를 관찰한다."],
      ["식욕부진 환자의 간호 중재로 적절하지 않은 것은?", "소량씩 자주 식사를 제공한다|식사 환경을 쾌적하게 한다|한 번에 많은 양을 제공하여 먹게 한다|좋아하는 음식을 포함한다", 2, "식욕부진 환자에게는 소량씩 자주 제공하고, 한 번에 많은 양을 주면 오히려 식욕이 감소한다."],
      ["비위관 삽입 길이로 적절한 것은?", "약 30cm|약 40cm|약 50cm|약 70cm", 2, "비위관 삽입 길이는 코끝→귓불→검상돌기까지 측정하며 약 50cm이다."],
      ["경관영양 시 주입 속도를 결정하는 원칙으로 옳은 것은?", "처음부터 빠른 속도로 주입한다|처음에는 느린 속도로 시작하여 점차 증가시킨다|속도는 중요하지 않다|항상 일정한 속도를 유지한다", 1, "처음에는 느린 속도(25~50mL/hr)로 시작하여 내성을 확인하면서 점차 증가시킨다."],
      ["통풍 환자에게 제한해야 하는 식품은?", "흰 쌀밥|내장류(간, 콩팥)|우유|달걀", 1, "내장류, 등푸른 생선, 육즙 등은 퓨린 함량이 높아 통풍 환자에게 제한한다."],
      ["TPN 주입 시 갑자기 중단하면 발생할 수 있는 합병증은?", "고혈당|저혈당|고나트륨혈증|고칼슘혈증", 1, "TPN을 갑자기 중단하면 인슐린이 아직 분비되고 있어 반동성 저혈당이 발생할 수 있다."],
      ["비위관을 통한 약물 투여 시 주의사항으로 옳은 것은?", "정제를 통째로 넣는다|장용정은 분쇄하여 투여한다|분쇄한 약물에 물을 충분히 섞어 투여한다|여러 약물을 한꺼번에 섞어 투여한다", 2, "약물은 분쇄 후 물에 충분히 녹여 투여하며, 장용정이나 서방정은 분쇄하지 않는다."],
      ["다음 중 영양 상태 평가의 신체 계측 항목이 아닌 것은?", "체중|삼두근 피부 주름 두께|상완 둘레|혈청 트랜스페린", 3, "혈청 트랜스페린은 혈액검사 항목이며, 신체 계측에는 체중, 신장, 삼두근 피부 주름 두께, 상완 둘레 등이 포함된다."]
    ]
  },
  "10": {
    t: "배변 돕기",
    q: [
      ["배변 관장 시 적절한 체위는?", "앙와위|우측위|좌측위(심스체위)|복위", 2, "좌측위(심스체위)를 취하면 해부학적으로 S상 결장에서 하행결장으로 관장액이 잘 흐른다."],
      ["배변 관장액의 적절한 온도는?", "25~30°C|32~37°C|40~43°C|50~55°C", 2, "관장액 온도는 40~43°C가 적절하며, 너무 뜨거우면 장 점막 손상, 너무 차가우면 경련을 유발한다."],
      ["정체 관장(retention enema)의 특징으로 옳은 것은?", "대량의 용액을 주입한다|주입 후 즉시 배출시킨다|주입 후 일정 시간 보유하게 한다|생리식염수만 사용한다", 2, "정체 관장은 오일 관장, 약물 관장 등으로 주입 후 일정 시간(30분~1시간) 보유하여 효과를 높인다."],
      ["글리세린 관장 시 관장 튜브의 삽입 깊이로 적절한 것은?", "성인 2~3cm|성인 5~10cm|성인 15~20cm|성인 20~25cm", 1, "성인의 관장 튜브 삽입 깊이는 약 7.5~10cm(5~10cm)이다."],
      ["관장 시 관장액 주입 높이로 적절한 것은?", "항문에서 10cm|항문에서 30~45cm|항문에서 60~80cm|항문에서 100cm", 1, "관장액 용기는 항문에서 30~45cm 높이에 위치시켜 적절한 압력으로 주입되게 한다."],
      ["장루(ostomy) 간호 시 피부 보호를 위해 적용하는 것은?", "알코올 소독|피부보호판(skin barrier)|항생제 연고|반창고", 1, "피부보호판(skin barrier)을 장루 주위에 적용하여 배설물에 의한 피부 손상을 예방한다."],
      ["결장루(colostomy) 중 가장 정상 변에 가까운 배설물이 나오는 위치는?", "상행결장루|횡행결장루|하행결장루|회장루", 2, "하행결장루와 S상결장루는 대장에서 수분 흡수가 충분히 이루어져 정상 변에 가까운 형태가 나온다."],
      ["변비 환자의 간호 중재로 적절하지 않은 것은?", "충분한 수분을 섭취한다|섬유소가 풍부한 음식을 섭취한다|규칙적인 운동을 한다|변의가 있을 때 참도록 교육한다", 3, "변의를 참으면 직장 감각이 둔해져 변비가 악화되므로, 변의가 있을 때 바로 화장실에 가도록 한다."],
      ["분변 매복(fecal impaction)의 증상으로 옳은 것은?", "다량의 정상 변 배출|소량의 묽은 변이 흘러나옴(overflow)|혈압 상승|체온 하강", 1, "분변 매복 시 굳은 변 주위로 소량의 묽은 변이 흘러나오는 overflow 현상이 나타날 수 있다."],
      ["배변 훈련 시 가장 적절한 시간은?", "취침 전|식후 30분 이내|아무 때나|새벽 시간", 1, "식후 위-결장 반사(gastrocolic reflex)가 활발하므로 식후 30분 이내가 배변 훈련에 적절하다."],
      ["디지털 분변 제거(digital disimpaction) 시 발생할 수 있는 합병증은?", "고혈압|미주신경 자극에 의한 서맥|빈맥|고혈당", 1, "직장 자극으로 미주신경이 자극되어 서맥, 저혈압이 발생할 수 있으므로 주의해야 한다."],
      ["다음 중 소량 관장(fleet enema)의 특징으로 옳은 것은?", "대량의 비눗물을 사용한다|시판되는 일회용 관장으로 120mL 정도이다|생리식염수 1000mL를 사용한다|관장 전 금식이 필요하다", 1, "소량 관장(fleet enema)은 시판 일회용으로 약 120mL의 고장성 용액을 사용한다."],
      ["회장루(ileostomy) 환자 간호로 옳은 것은?", "배설물이 고형이므로 관리가 쉽다|수분과 전해질 불균형에 주의한다|세척 관장을 정기적으로 한다|주머니 교환은 한 달에 한 번 한다", 1, "회장루는 액상의 배설물이 지속적으로 나오므로 수분과 전해질 불균형에 주의해야 한다."],
      ["관장 시 대상자가 복통을 호소하면 적절한 간호 중재는?", "관장액 주입을 더 빨리 한다|관장을 즉시 중단하고 보고한다|주입 속도를 늦추고 심호흡을 시킨다|체위를 앙와위로 변경한다", 2, "복통 호소 시 주입을 잠시 멈추고 심호흡을 하게 하며, 주입 속도를 늦춘다. 심한 경우 중단한다."],
      ["장루 주머니 교환 시기로 가장 적절한 것은?", "식사 직후|주머니가 1/3~1/2 찼을 때|주머니가 완전히 찼을 때|정해진 시간 없이 아무 때나", 1, "장루 주머니는 1/3~1/2 정도 찼을 때 비우거나 교환하여 무게로 인한 떨어짐을 방지한다."],
      ["설사 환자의 간호 중재로 적절한 것은?", "고섬유소 식이를 제공한다|수분 섭취를 제한한다|수분과 전해질을 보충한다|지방이 많은 음식을 제공한다", 2, "설사 시 수분과 전해질 손실이 크므로 보충이 중요하며, 탈수 징후를 관찰한다."],
      ["비눗물(soap suds) 관장의 비누 농도로 적절한 것은?", "1~2%|5%|10%|20%", 0, "비눗물 관장 시 비누 농도는 1~2%가 적절하며, 순한 비누(castile soap)를 사용한다."],
      ["장루 세척(colostomy irrigation) 시 세척액의 양으로 적절한 것은?", "100~200mL|500~1000mL|1500~2000mL|3000mL", 1, "장루 세척 시 미온수 500~1000mL를 사용하며, 세척액 온도는 40~43°C가 적절하다."],
      ["다음 중 변비를 유발할 수 있는 약물은?", "하제|마약성 진통제|항생제|이뇨제", 1, "마약성 진통제(opioids)는 장 운동을 억제하여 변비를 유발할 수 있다."],
      ["잠혈 검사(occult blood test) 시 위양성 결과를 유발할 수 있는 음식은?", "쌀밥|붉은 고기(적색육)|우유|두부", 1, "붉은 고기, 철분제, 비타민C 과량 섭취 등은 잠혈 검사 위양성을 유발할 수 있다."],
      ["관장 튜브 삽입 시 윤활제를 바르는 길이는?", "1~2cm|5~8cm|15cm|20cm", 1, "관장 튜브 끝에서 5~8cm 정도 수용성 윤활제를 발라 삽입 시 점막 손상을 예방한다."],
      ["대변 검체 채취 시 주의사항으로 옳은 것은?", "소변이 섞여도 괜찮다|무균적으로 채취해야 한다|다른 부위 2~3곳에서 채취한다|검체를 냉동 보관한다", 2, "대변 검체는 다른 부위 2~3곳에서 채취하여 정확도를 높이며, 소변이 섞이지 않도록 한다."],
      ["장음(bowel sound) 청진 시 정상 빈도는?", "1분에 1~2회|1분에 5~35회|1분에 50~60회|1분에 100회 이상", 1, "정상 장음은 1분에 5~35회로, 불규칙적인 구르륵 소리가 들린다."],
      ["장루 주위 피부 간호로 적절하지 않은 것은?", "장루 주위를 미온수로 세척한다|알코올로 소독한다|피부보호판을 적용한다|피부를 완전히 건조시킨 후 주머니를 부착한다", 1, "알코올은 피부를 자극하고 건조시키므로 사용하지 않으며, 미온수로 부드럽게 세척한다."],
      ["관장 종류 중 약물 관장에 해당하는 것은?", "생리식염수 관장|비눗물 관장|카약세린(kayexalate) 관장|수돗물 관장", 2, "카약세린은 고칼륨혈증 치료를 위한 약물 관장으로, 장에서 칼륨을 흡착하여 배출한다."],
      ["변실금(fecal incontinence) 환자의 간호 중재로 옳은 것은?", "수분 섭취를 제한한다|회음부 피부를 청결히 유지한다|활동을 제한한다|저섬유소 식이를 제공한다", 1, "변실금 환자는 피부 손상 예방을 위해 회음부를 청결히 유지하고 피부 보호제를 적용한다."],
      ["수돗물 관장 시 발생할 수 있는 합병증은?", "고나트륨혈증|수분중독(water intoxication)|고칼륨혈증|탈수", 1, "수돗물은 저장성 용액이므로 반복 사용 시 수분이 장 점막을 통해 흡수되어 수분중독이 발생할 수 있다."],
      ["변비 예방을 위한 일일 수분 섭취 권장량은?", "500mL|1000mL|1500~2000mL|3000mL", 2, "변비 예방을 위해 하루 1500~2000mL의 수분 섭취가 권장된다."],
      ["장루의 정상적인 색깔은?", "창백한 분홍색|선홍색(붉은색)|청색|검은색", 1, "정상 장루는 점막으로 선홍색이며, 창백하거나 청색이면 혈류 장애를 의미하므로 보고한다."],
      ["고장성 용액 관장(hypertonic enema)의 작용 기전은?", "장 점막을 직접 자극한다|삼투압에 의해 장 내로 수분을 끌어들인다|장 근육을 이완시킨다|대변을 부드럽게 한다", 1, "고장성 용액은 삼투압 작용으로 장 내로 수분을 끌어들여 장 팽창을 유발하고 연동운동을 촉진한다."]
    ]
  },
  "11": {
    t: "배뇨 돕기",
    q: [
      ["유치도뇨관(Foley catheter) 삽입 시 여성의 삽입 길이는?", "2~3cm|5~7cm|10~15cm|17~20cm", 1, "여성의 요도 길이는 약 4cm로, 도뇨관은 5~7cm 삽입하여 소변이 나오는 것을 확인한다."],
      ["유치도뇨관 삽입 시 남성의 삽입 길이는?", "5~7cm|10~12cm|17~20cm|25~30cm", 2, "남성의 요도 길이는 약 20cm로, 도뇨관은 17~20cm 삽입한다."],
      ["유치도뇨관 소변주머니의 위치로 적절한 것은?", "방광보다 높이 위치시킨다|방광과 같은 높이에 위치시킨다|방광보다 아래에 위치시킨다|어디에 위치시켜도 상관없다", 2, "소변주머니는 역류 감염 방지를 위해 항상 방광보다 아래에 위치시킨다."],
      ["단순 도뇨(straight catheterization)의 목적으로 옳은 것은?", "지속적으로 소변을 배출한다|잔뇨량을 측정한다|방광을 세척한다|요도를 확장한다", 1, "단순 도뇨는 잔뇨량 측정, 소변 검체 채취, 일시적 배뇨 장애 해소 등의 목적으로 시행한다."],
      ["도뇨관 관련 요로감염(CAUTI) 예방 간호로 옳은 것은?", "도뇨관을 자주 교환한다|배뇨 시스템을 개방형으로 유지한다|폐쇄 배뇨 시스템을 유지한다|소변주머니를 방광 위에 둔다", 2, "폐쇄 배뇨 시스템을 유지하고, 불필요한 도뇨관 연결 분리를 피하여 감염을 예방한다."],
      ["방광 훈련(bladder training)의 방법으로 옳은 것은?", "수분 섭취를 제한한다|배뇨 간격을 점차 늘려간다|소변이 마려울 때마다 즉시 배뇨한다|도뇨관을 계속 유지한다", 1, "방광 훈련은 배뇨 간격을 점차 늘려(15~30분씩) 방광 용량을 증가시키는 훈련이다."],
      ["긴장성 요실금(stress incontinence)의 특징은?", "배뇨 전에 강한 요의를 느낀다|기침, 재채기 시 소변이 새어 나온다|소변을 전혀 느끼지 못한다|소변이 지속적으로 흘러나온다", 1, "긴장성 요실금은 복압이 증가하는 활동(기침, 재채기, 웃음) 시 소변이 새어 나오는 것이다."],
      ["케겔 운동(Kegel exercise)의 목적은?", "복근을 강화한다|골반저근을 강화한다|대퇴근을 강화한다|등 근육을 강화한다", 1, "케겔 운동은 골반저근(치골미골근)을 강화하여 요실금을 예방하고 개선한다."],
      ["잔뇨량 측정 시 정상 범위는?", "50mL 미만|50~100mL|100~200mL|200mL 이상", 0, "정상 잔뇨량은 50mL 미만이며, 100mL 이상이면 비정상으로 배뇨 장애를 의심한다."],
      ["도뇨관 삽입 전 회음부 소독 순서로 옳은 것은?", "요도구에서 바깥쪽으로|바깥쪽에서 요도구 방향으로|위에서 아래로 한 번만|원형으로 문지른다", 0, "요도구에서 바깥쪽(소음순→대음순)으로 소독하여 요도구 오염을 방지한다."],
      ["유치도뇨관의 벌룬(balloon)에 주입하는 용액은?", "공기|멸균 증류수|생리식염수|수돗물", 1, "벌룬에는 멸균 증류수를 주입하며, 생리식염수는 결정이 침착되어 벌룬이 수축하지 않을 수 있다."],
      ["치골상부 도뇨(suprapubic catheterization)의 특징으로 옳은 것은?", "요도를 통해 삽입한다|복부 치골 상부를 통해 방광에 직접 삽입한다|직장을 통해 삽입한다|항상 일시적으로만 사용한다", 1, "치골상부 도뇨는 복부 치골 상부를 통해 방광에 직접 카테터를 삽입하는 방법이다."],
      ["요정체(urinary retention) 환자에게 배뇨를 촉진하는 간호 중재는?", "수분 섭취를 제한한다|치골상부에 냉찜질을 한다|흐르는 물소리를 들려준다|복부를 꽉 조여 압박한다", 2, "흐르는 물소리, 미온수 좌욕, 치골상부 온찜질 등이 배뇨를 촉진하는 간호 중재이다."],
      ["소변 검체 채취 시 중간뇨(midstream urine)를 받는 이유는?", "양이 많아서|초기 소변의 세균 오염을 줄이기 위해|마지막 소변이 농축되어서|편리해서", 1, "처음 소변에는 요도 주위의 세균이 포함되므로, 처음 소변은 버리고 중간뇨를 받아 오염을 줄인다."],
      ["유치도뇨관 삽입 환자의 간호로 적절한 것은?", "도뇨관을 대퇴부 안쪽에 고정한다|남성은 복부에, 여성은 대퇴부 안쪽에 고정한다|도뇨관은 고정하지 않는다|도뇨관을 침대 난간에 고정한다", 1, "남성은 음경 꺾임 방지를 위해 하복부에, 여성은 대퇴부 안쪽에 고정한다."],
      ["간헐적 자가도뇨(CIC)의 장점으로 옳은 것은?", "도뇨관을 계속 유지하므로 편리하다|요로감염 위험이 유치도뇨보다 낮다|무균술이 필요 없다|전문가만 시행할 수 있다", 1, "간헐적 자가도뇨는 유치도뇨에 비해 요로감염 위험이 낮고, 환자의 자립성을 높인다."],
      ["정상 성인의 1일 소변량은?", "100~300mL|500~800mL|1200~1500mL|3000~4000mL", 2, "정상 성인의 1일 소변량은 약 1200~1500mL(1000~2000mL)이다."],
      ["핍뇨(oliguria)의 기준은?", "1일 소변량 100mL 미만|1일 소변량 400mL 미만|1일 소변량 1000mL 미만|1일 소변량 2000mL 이상", 1, "핍뇨는 1일 소변량이 400mL 미만인 경우를 말한다."],
      ["무뇨(anuria)의 기준은?", "1일 소변량 400mL 미만|1일 소변량 200mL 미만|1일 소변량 100mL 미만|전혀 소변이 나오지 않음", 2, "무뇨는 1일 소변량이 100mL 미만인 경우를 말한다."],
      ["절박성 요실금(urge incontinence)의 특징은?", "기침 시 소변이 나온다|갑작스러운 강한 요의 후 소변이 새어 나온다|소변을 전혀 느끼지 못한다|복압 증가 시에만 발생한다", 1, "절박성 요실금은 갑작스럽고 강한 요의를 느낀 후 참지 못하고 소변이 새어 나오는 것이다."],
      ["유치도뇨관 삽입 환자에게 충분한 수분 섭취를 권장하는 이유는?", "도뇨관이 잘 빠지게 하기 위해|자연 세척 효과로 감염을 예방하기 위해|벌룬을 유지하기 위해|소변 색을 맑게 하기 위해", 1, "충분한 수분 섭취는 소변을 희석시켜 자연적인 세척 효과를 주어 요로감염을 예방한다."],
      ["도뇨관 삽입 시 무균술이 필요한 가장 중요한 이유는?", "출혈을 예방하기 위해|요로감염을 예방하기 위해|통증을 줄이기 위해|삽입을 용이하게 하기 위해", 1, "요도는 외부와 연결된 통로이므로 무균술을 지켜 요로감염(상행성 감염)을 예방해야 한다."],
      ["소변주머니를 비우는 방법으로 옳은 것은?", "소변주머니를 도뇨관에서 분리하여 비운다|배출구(drain port)를 열어 비운다|주사기로 흡인하여 비운다|소변주머니를 교체한다", 1, "소변주머니 하단의 배출구(drain port)를 열어 비우며, 연결 부위를 분리하지 않아 폐쇄 시스템을 유지한다."],
      ["도뇨관 삽입 시 여성에서 질(vagina)에 잘못 삽입한 경우 적절한 처치는?", "그대로 두고 다시 삽입한다|잘못 삽입된 것을 빼고 같은 카테터로 다시 삽입한다|잘못 삽입된 것은 그대로 두고 새 카테터로 요도에 삽입한다|시술을 중단한다", 2, "질에 삽입된 카테터는 요도구 확인의 표지로 그대로 두고, 새로운 멸균 카테터로 요도에 삽입한다."],
      ["야뇨증(nocturia) 환자의 간호 중재로 적절한 것은?", "저녁에 수분 섭취를 제한한다|야간에 이뇨제를 복용한다|취침 전 카페인 음료를 마신다|낮에 수분 섭취를 제한한다", 0, "야뇨증 환자는 저녁 시간 이후 수분 섭취를 줄이고, 취침 전 배뇨하도록 한다."],
      ["도뇨관 삽입 시 저항이 느껴지면 적절한 대처는?", "힘을 주어 밀어 넣는다|무리하지 않고 중단 후 보고한다|다른 쪽 요도로 시도한다|도뇨관 크기를 늘린다", 1, "저항이 느껴지면 무리하게 삽입하지 않고 중단하며, 요도 손상 위험이 있으므로 보고한다."],
      ["소변 비중(specific gravity)의 정상 범위는?", "1.001~1.005|1.010~1.025|1.030~1.040|1.050~1.060", 1, "소변 비중의 정상 범위는 1.010~1.025이며, 농축 정도를 반영한다."],
      ["콘돔 카테터(condom catheter) 적용 대상으로 적절한 것은?", "의식이 있는 여성 환자|요도 폐색이 있는 남성 환자|실금이 있는 남성 환자|방광 세척이 필요한 환자", 2, "콘돔 카테터는 요실금이 있는 남성 환자에게 비침습적으로 적용하는 외부 배뇨 장치이다."],
      ["유치도뇨관 제거 후 간호로 적절한 것은?", "6~8시간 내 자연 배뇨 여부를 확인한다|배뇨와 무관하게 관찰할 필요가 없다|즉시 다시 삽입한다|수분 섭취를 제한한다", 0, "도뇨관 제거 후 6~8시간 내 자연 배뇨 여부를 확인하고, 배뇨하지 못하면 보고한다."],
      ["24시간 소변 검사 시 주의사항으로 옳은 것은?", "검사 시작 시 첫 소변을 포함한다|검사 시작 시 첫 소변은 버리고, 이후 모든 소변을 모은다|마지막 소변은 버린다|검체를 실온에 보관한다", 1, "검사 시작 시 첫 소변은 버리고, 이후 24시간 동안 모든 소변을 모으며 마지막 소변을 포함한다."]
    ]
  },
  "12": {
    t: "체위 유지 돕기",
    q: [
      ["파울러 체위(Fowler's position)에서 침상 머리의 각도는?", "15~30도|30~45도|45~60도|80~90도", 2, "파울러 체위는 침상 머리를 45~60도 올리는 체위이다."],
      ["반좌위(semi-Fowler's position)에서 침상 머리의 각도는?", "15~30도|30~45도|45~60도|80~90도", 1, "반좌위는 침상 머리를 30~45도 올리는 체위이다."],
      ["고파울러 체위(high-Fowler's position)에서 침상 머리의 각도는?", "30~45도|45~60도|60~90도|80~90도", 2, "고파울러 체위는 침상 머리를 60~90도로 올리는 체위이다."],
      ["트렌델렌버그 체위(Trendelenburg position)는?", "침상 머리를 올리고 발쪽을 내린다|침상 머리를 내리고 발쪽을 올린다|측위로 눕는다|복위로 눕는다", 1, "트렌델렌버그 체위는 머리를 낮추고 다리를 높이는 체위로, 쇼크 시 하지 정맥 환류를 촉진한다."],
      ["심스 체위(Sim's position)의 특징은?", "완전히 옆으로 눕는 체위|반쯤 엎드리고 반쯤 옆으로 눕는 체위|완전히 엎드리는 체위|반쯤 앉은 체위", 1, "심스 체위는 반복위(semi-prone)로, 관장, 직장 검진, 의식 없는 환자에게 적용한다."],
      ["앙와위(supine position)에서 발생할 수 있는 합병증으로 옳은 것은?", "고관절 외전 구축|족하수(foot drop)|고관절 내전 구축|무릎 과신전", 1, "앙와위 시 발끝이 아래로 처져 족하수가 발생할 수 있으므로 발판(foot board)을 사용한다."],
      ["측위(lateral position)에서 아래쪽 다리의 위치로 적절한 것은?", "완전히 편다|약간 구부린다|위쪽 다리 위에 올린다|침상 밖으로 내린다", 1, "측위 시 아래쪽 다리는 약간 구부리고, 위쪽 다리는 더 구부려 베개 위에 놓아 안정감을 준다."],
      ["복위(prone position)가 금기인 대상자는?", "요통 환자|경추 손상 환자|복부 수술 후 환자|피부 통합성 유지 환자", 2, "복위는 복부 수술 후 환자에게 금기이며, 척추 수술 후 환자에게 적용될 수 있다."],
      ["체위 변경의 주기로 적절한 것은?", "1시간마다|2시간마다|4시간마다|8시간마다", 1, "욕창 예방을 위해 최소 2시간마다 체위를 변경한다."],
      ["파울러 체위가 적용되는 경우로 적절한 것은?", "쇼크 환자|호흡곤란 환자|척추 수술 후 환자|하지 부종 환자", 1, "파울러 체위는 호흡곤란 환자에게 적용하여 횡격막을 하강시켜 폐 팽창을 돕는다."],
      ["앙와위에서 요추 부위의 지지를 위해 사용하는 것은?", "모래주머니|작은 베개나 수건 롤|발판|침상 난간", 1, "앙와위에서 요추의 정상적인 만곡을 유지하기 위해 작은 베개나 수건 롤을 요추 아래에 놓는다."],
      ["좌위(sitting position/orthopneic position)가 필요한 대상자는?", "저혈압 환자|심한 호흡곤란 환자|의식 없는 환자|하지 골절 환자", 1, "기좌호흡(orthopnea) 환자는 좌위에서 오버 베드 테이블에 기대어 호흡하면 편안해진다."],
      ["쇄석위(lithotomy position)의 적용 대상으로 옳은 것은?", "호흡곤란 환자|회음부 검진이나 분만 시|쇼크 환자|의식 없는 환자", 1, "쇄석위는 회음부 검진, 분만, 비뇨기과 시술 시 사용되며, 등을 대고 다리를 올리는 체위이다."],
      ["복위(prone position) 시 주의해야 할 점은?", "고개를 앞으로 숙인다|흉부 압박에 의한 호흡 장애에 주의한다|양쪽 다리를 교차시킨다|팔을 몸 아래에 둔다", 1, "복위 시 흉부 압박으로 호흡 장애가 올 수 있으므로, 얼굴을 옆으로 돌리고 체중 분산에 주의한다."],
      ["측위에서 위쪽 팔의 적절한 위치는?", "몸 아래에 넣는다|베개 위에 올려놓는다|머리 위로 올린다|몸통에 붙인다", 1, "측위에서 위쪽 팔은 베개 위에 올려놓아 어깨와 팔의 내회전, 내전을 예방한다."],
      ["앙와위에서 족하수(foot drop)를 예방하기 위한 간호 중재는?", "무릎 밑에 베개를 넣는다|발판(foot board)을 사용한다|양 다리를 교차시킨다|침상 끝을 올린다", 1, "발판을 발바닥에 대어 발목의 족저굴곡을 방지하여 족하수를 예방한다."],
      ["역 트렌델렌버그 체위(reverse Trendelenburg)는?", "머리를 낮추고 다리를 올린다|머리를 올리고 다리를 낮춘다|측위로 눕는다|앙와위를 유지한다", 1, "역 트렌델렌버그는 머리를 높이고 발쪽을 낮추는 체위로, 두경부 수술 후 적용될 수 있다."],
      ["외전 베개(abduction pillow)의 사용 목적은?", "무릎 굴곡을 유지한다|고관절 내전을 방지한다|발목 과신전을 방지한다|어깨 외회전을 유지한다", 1, "외전 베개는 양 다리 사이에 놓아 고관절 내전을 방지하며, 고관절 수술 후 주로 사용한다."],
      ["대상자의 체위를 변경할 때 전단력(shearing force)을 줄이는 방법은?", "대상자를 끌어당긴다|대상자를 들어올려 이동한다|시트를 강하게 당긴다|대상자를 밀어서 이동한다", 1, "대상자를 끌지 않고 들어올려 이동하면 피부와 침상 사이의 전단력(마찰력)을 줄일 수 있다."],
      ["앙와위에서 고관절 외회전을 예방하기 위한 간호 용품은?", "발판|전자 롤(trochanter roll)|손 롤(hand roll)|모래주머니만 사용", 1, "전자 롤(대전자 롤)을 대전자 부위에 대어 고관절 외회전을 예방한다."],
      ["반좌위에서 환자가 침상 아래로 미끄러지는 것을 방지하는 방법은?", "억제대를 적용한다|무릎 부위를 약간 굴곡시킨다|침상 머리를 더 올린다|발판을 제거한다", 1, "반좌위에서 무릎을 약간 굴곡시키면 미끄러짐을 방지하고 복부 근육의 긴장을 줄인다."],
      ["욕창 호발 부위 중 앙와위에서 가장 많이 발생하는 곳은?", "귀|천골부(sacrum)|슬개골|발가락", 1, "앙와위에서는 천골부에 가장 많이 욕창이 발생하며, 체중 압력이 집중되는 부위이다."],
      ["측위에서 욕창 호발 부위는?", "천골부|대전자부(greater trochanter)|견갑골|뒤통수", 1, "측위에서는 대전자부, 외과(lateral malleolus), 귀 등에 욕창이 호발한다."],
      ["체위 변경 시 보디 메카닉스(body mechanics) 원칙으로 옳은 것은?", "기저면을 좁게 한다|무릎을 펴고 허리를 굽혀 든다|대상자를 몸에서 멀리 두고 든다|무릎을 구부리고 대상자를 몸 가까이 한다", 3, "무릎을 구부리고 대상자를 몸 가까이 하여 무게중심을 낮추고 기저면을 넓히는 것이 올바른 보디 메카닉스이다."],
      ["복위에서 얼굴의 적절한 위치는?", "정면을 향한다|한쪽으로 돌린다|침대에 묻는다|뒤로 젖힌다", 1, "복위 시 질식을 예방하기 위해 얼굴을 한쪽으로 돌려 기도를 유지한다."],
      ["파울러 체위에서 장시간 유지 시 발생할 수 있는 문제는?", "두개내압 상승|둔부와 천골 부위의 압력 증가|호흡곤란|경추 손상", 1, "파울러 체위에서 둔부와 천골에 체중이 집중되므로 욕창 발생 위험이 높아진다."],
      ["손 롤(hand roll)의 사용 목적은?", "손가락 과신전 방지|손의 기능적 위치 유지|손목 외전 유지|팔꿈치 굴곡 유지", 1, "손 롤은 손을 기능적 위치(약간 굴곡된 상태)로 유지하여 구축을 예방한다."],
      ["앙와위에서 어깨 내전과 내회전을 예방하기 위한 방법은?", "팔을 몸통에 밀착시킨다|팔을 약간 외전시키고 베개로 지지한다|팔을 머리 위로 올린다|팔을 침상 아래로 내린다", 1, "팔을 약간 외전시키고 베개로 지지하여 어깨 관절의 구축을 예방한다."],
      ["체위 유지의 목적으로 적절하지 않은 것은?", "욕창 예방|관절 구축 예방|근육 위축 촉진|안위 증진", 2, "체위 유지는 욕창 예방, 관절 구축 예방, 안위 증진이 목적이며, 근육 위축을 촉진하는 것은 해당하지 않는다."],
      ["90도 측위에서 주의해야 할 사항은?", "대전자부에 직접 체중이 실리지 않게 한다|대전자부에 직접 체중을 실린다|아래쪽 다리를 완전히 편다|베개를 사용하지 않는다", 0, "30도 측위가 대전자부 압력을 줄여 욕창 예방에 효과적이며, 90도 측위는 대전자부 압력이 높아진다."]
    ]
  },
  "13": {
    t: "운동과 이동 돕기",
    q: [
      ["관절 가동범위(ROM) 운동의 목적으로 옳은 것은?", "근력을 증가시킨다|관절의 유연성을 유지한다|심폐 기능을 향상시킨다|체중을 감소시킨다", 1, "ROM 운동은 관절의 유연성과 가동범위를 유지하여 구축을 예방하는 것이 주목적이다."],
      ["수동적 관절 가동범위 운동(passive ROM)의 대상은?", "스스로 운동할 수 있는 환자|의식이 없거나 마비된 환자|운동 선수|통증이 없는 환자", 1, "수동적 ROM 운동은 스스로 움직일 수 없는 환자(의식 없는, 마비된 환자)에게 간호사가 시행한다."],
      ["등척성 운동(isometric exercise)의 특징은?", "관절 운동이 동반된다|관절 운동 없이 근육을 수축시킨다|기구를 이용한다|유산소 운동이다", 1, "등척성 운동은 관절 움직임 없이 근육만 수축시키는 운동으로, 석고 고정 중인 환자도 가능하다."],
      ["목발 보행 시 3점 보행(3-point gait)의 방법은?", "양쪽 목발과 건측 다리를 동시에 내민다|양쪽 목발과 환측 다리를 동시에 내민다|한쪽 목발과 반대쪽 다리를 동시에 내민다|양쪽 목발을 먼저 짚고 양 다리를 동시에 내민다", 1, "3점 보행은 양쪽 목발과 환측 다리를 동시에 내밀고, 이어서 건측 다리를 내미는 방법이다."],
      ["목발 보행 시 계단을 올라갈 때의 순서로 옳은 것은?", "목발 → 건측 다리 → 환측 다리|건측 다리 → 목발과 환측 다리|환측 다리 → 목발 → 건측 다리|목발과 환측 다리 → 건측 다리", 1, "계단 올라갈 때: 건측 다리 먼저 → 목발과 환측 다리. '좋은 발이 천국으로'"],
      ["목발 보행 시 계단을 내려갈 때의 순서로 옳은 것은?", "건측 다리 → 목발과 환측 다리|목발과 환측 다리 → 건측 다리|양 다리 동시에 → 목발|목발 → 양 다리 동시에", 1, "계단 내려갈 때: 목발과 환측 다리 먼저 → 건측 다리. '나쁜 발이 지옥으로'"],
      ["목발 사용 시 적절한 목발 높이는?", "겨드랑이에 밀착되게|겨드랑이에서 2~3횡지(약 5cm) 아래|어깨 높이|허리 높이", 1, "목발 윗부분은 겨드랑이에서 2~3횡지(약 5cm) 아래에 위치하여 겨드랑이 신경 손상을 방지한다."],
      ["목발 보행 시 체중을 지탱하는 부위로 적절한 곳은?", "겨드랑이|손잡이(hand grip)|어깨|팔꿈치", 1, "체중은 반드시 손잡이(hand grip)로 지탱해야 하며, 겨드랑이로 지탱하면 신경 손상(목발 마비)이 발생한다."],
      ["보행기(walker) 사용 시 적절한 보행 순서는?", "보행기 → 건측 다리 → 환측 다리|보행기 → 환측 다리 → 건측 다리|환측 다리 → 보행기 → 건측 다리|건측 다리 → 보행기 → 환측 다리", 1, "보행기를 먼저 앞으로 옮기고, 환측 다리를 내밀고, 건측 다리를 내미는 순서이다."],
      ["낙상 예방 간호로 적절하지 않은 것은?", "침상 난간을 올린다|바닥을 건조하게 유지한다|야간에 조명을 끈다|미끄럼 방지 신발을 착용한다", 2, "야간에는 희미한 조명을 유지하여 이동 시 시야를 확보해야 낙상을 예방할 수 있다."],
      ["환자를 침상에서 휠체어로 이동할 때 휠체어의 위치는?", "침상과 직각으로 놓는다|침상과 평행하게 건측에 놓는다|침상의 환측에 놓는다|침상의 발치에 놓는다", 1, "휠체어를 건측에 놓아 환자가 건측 다리로 체중을 지탱하며 이동할 수 있게 한다."],
      ["휠체어 이동 시 가장 먼저 해야 할 것은?", "환자를 안는다|휠체어의 바퀴를 잠근다|발판을 올린다|등받이를 눕힌다", 1, "이동 전 반드시 휠체어의 바퀴를 잠그고, 발판을 접어야 안전하게 이동할 수 있다."],
      ["편마비 환자가 지팡이로 보행할 때 지팡이를 잡는 손은?", "환측 손|건측 손|양손|어느 손이든 상관없다", 1, "지팡이는 건측 손으로 잡아야 환측 다리를 내밀 때 지지가 된다."],
      ["4점 보행(4-point gait)의 순서로 옳은 것은?", "우측 목발 → 좌측 발 → 좌측 목발 → 우측 발|양측 목발 → 양측 발|우측 목발 → 우측 발 → 좌측 목발 → 좌측 발|양측 발 → 양측 목발", 0, "4점 보행: 우측 목발 → 좌측 발 → 좌측 목발 → 우측 발 순으로 교대로 내밀며 안정적이다."],
      ["환자 이동 시 보디 메카닉스의 원리로 옳은 것은?", "기저면을 좁게 하고 무게중심을 높인다|기저면을 넓게 하고 무게중심을 낮춘다|허리를 사용하여 든다|대상자를 몸에서 멀리 둔다", 1, "기저면을 넓히고 무게중심을 낮추면 안정성이 높아지고 근골격계 손상을 예방한다."],
      ["ROM 운동 시 주의사항으로 옳은 것은?", "통증이 있어도 강제로 시행한다|빠르고 강하게 시행한다|각 동작을 3~5회 반복한다|관절을 최대한 과신전시킨다", 2, "ROM 운동은 각 동작을 3~5회 반복하며, 천천히 부드럽게 시행하고 통증이 있으면 중단한다."],
      ["부동(immobility)으로 인한 근골격계 합병증이 아닌 것은?", "근 위축|골다공증|관절 구축|빈맥", 3, "빈맥은 심혈관계 합병증이며, 근골격계 합병증에는 근 위축, 골다공증, 관절 구축 등이 있다."],
      ["부동으로 인한 호흡기계 합병증은?", "기립성 저혈압|흡인성 폐렴|심부정맥혈전증|요로감염", 1, "부동 시 폐 분비물이 정체되어 저환기성 폐렴, 무기폐 등이 발생할 수 있다."],
      ["지팡이 보행 시 지팡이의 적절한 위치는?", "발 앞쪽 15cm|발 옆 15cm, 앞쪽 15cm|발 뒤쪽 15cm|발 옆 30cm", 1, "지팡이는 발 옆 약 15cm, 앞쪽 약 15cm에 위치시켜 넓은 기저면을 확보한다."],
      ["2점 보행(2-point gait)의 특징은?", "한쪽 목발과 같은 쪽 발을 동시에 내민다|한쪽 목발과 반대쪽 발을 동시에 내민다|양쪽 목발을 동시에 내민다|양발을 동시에 내민다", 1, "2점 보행은 한쪽 목발과 반대쪽 발을 동시에 내미는 방법으로, 정상 보행과 유사하다."],
      ["스윙 보행(swing-through gait)이 적합한 대상자는?", "한쪽 다리만 약한 환자|양 하지 마비 환자|상지가 약한 환자|인지장애 환자", 1, "스윙 보행은 양 하지 마비 환자에게 적합하며, 양쪽 목발을 짚고 양 다리를 목발 앞으로 내민다."],
      ["편마비 환자의 침상에서 일어나는 순서로 옳은 것은?", "환측으로 돌아누워 일어난다|건측으로 돌아누워 건측 팔로 밀어 일어난다|양팔로 동시에 밀어 일어난다|발부터 내려서 일어난다", 1, "건측으로 돌아누워 건측 팔로 침대를 밀어 일어나야 안전하다."],
      ["낙상 위험 평가 도구로 옳은 것은?", "글래스고우 혼수 척도(GCS)|브레이든 척도(Braden scale)|모스 낙상 척도(Morse Fall Scale)|노턴 척도(Norton scale)", 2, "모스 낙상 척도는 낙상 위험 평가 도구이며, 브레이든/노턴은 욕창 위험 평가 도구이다."],
      ["부동으로 인한 심혈관계 합병증은?", "관절 구축|기립성 저혈압|무기폐|요정체", 1, "부동 시 정맥 환류 감소로 기립성 저혈압, 심부정맥혈전증 등 심혈관계 합병증이 발생한다."],
      ["휠체어에서 경사로를 내려갈 때 적절한 방법은?", "앞으로 전진하여 내려간다|뒤로 후진하여 내려간다|옆으로 이동한다|빠르게 내려간다", 1, "경사로를 내려갈 때는 뒤로 후진하여 천천히 내려가면 환자가 앞으로 쏠리는 것을 방지한다."],
      ["이동 보조 기구 중 가장 안정적인 것은?", "지팡이|목발|보행기(walker)|쿼드 케인(quad cane)", 2, "보행기는 4개의 다리로 넓은 기저면을 제공하여 가장 안정적인 보행 보조 기구이다."],
      ["능동적-보조 ROM 운동(active-assistive ROM)의 대상은?", "의식이 없는 환자|스스로 움직일 수 있지만 근력이 약한 환자|완전 마비 환자|건강한 사람", 1, "능동적-보조 ROM은 환자가 스스로 움직이되 간호사가 부족한 부분을 보조하는 운동이다."],
      ["부동으로 인한 비뇨기계 합병증은?", "요로결석|골다공증|무기폐|기립성 저혈압", 0, "부동 시 골에서 칼슘이 유리되어 고칼슘뇨증이 되고, 소변 정체와 함께 요로결석이 발생할 수 있다."],
      ["환자 이동 시 이동용 벨트(transfer belt)의 사용 목적은?", "환자를 고정시키기 위해|간호사가 환자를 안전하게 잡기 위해|욕창을 예방하기 위해|환자의 통증을 줄이기 위해", 1, "이동용 벨트는 환자의 허리에 착용하여 간호사가 안전하게 잡고 이동을 보조할 수 있게 한다."],
      ["대퇴사두근 강화 운동(quadriceps setting exercise)의 방법은?", "무릎을 구부렸다 편다|무릎을 펴고 대퇴사두근을 수축시킨다|다리를 높이 든다|발목을 돌린다", 1, "대퇴사두근 강화 운동은 무릎을 편 상태에서 대퇴사두근을 5~10초간 수축시키는 등척성 운동이다."]
    ]
  },
  "14": {
    t: "신체 보호대 적용 돕기",
    q: [
      ["신체 보호대(억제대) 적용 시 순환 상태 확인 주기는?", "30분마다|1시간마다|2시간마다|4시간마다", 2, "억제대 적용 후 최소 2시간마다 풀어주고, 순환 상태, 피부 상태, 신경 기능을 확인한다."],
      ["억제대 적용 시 억제대와 피부 사이의 여유 공간은?", "1횡지|2횡지|3횡지|4횡지", 1, "억제대와 피부 사이에 성인 손가락 2횡지(약 2.5~5cm)의 여유를 두어 순환 장애를 방지한다."],
      ["억제대를 적용하기 전 가장 먼저 시도해야 하는 것은?", "의사 처방을 받는다|억제대의 종류를 선택한다|대안적 방법(비억제적 중재)을 시도한다|보호자에게 동의서를 받는다", 2, "억제대 적용 전 반드시 대안적 방법(환경 조정, 주의 전환, 가족 동반 등)을 먼저 시도해야 한다."],
      ["억제대 적용의 법적 원칙으로 옳은 것은?", "간호사 판단으로 자유롭게 적용한다|의사의 처방이 필요하다|보호자만 동의하면 된다|응급 상황에서도 처방이 먼저 필요하다", 1, "억제대 적용에는 의사의 처방이 필요하며, 응급 시 적용 후 사후 처방을 받을 수 있다."],
      ["손목 억제대 적용 시 매듭 방법으로 적절한 것은?", "고정매듭(square knot)|풀기 쉬운 매듭(quick-release knot)|이중매듭|나비매듭", 1, "응급 시 빠르게 풀 수 있도록 풀기 쉬운 매듭(quick-release knot)으로 고정한다."],
      ["억제대를 고정하는 위치로 적절한 것은?", "침상 난간에 고정한다|침대 프레임(움직이지 않는 부분)에 고정한다|매트리스에 고정한다|환자의 옷에 고정한다", 1, "억제대는 침대의 움직이지 않는 프레임에 고정하며, 난간에 고정하면 난간 조작 시 위험하다."],
      ["장갑형 억제대(mitten restraint)의 사용 목적은?", "사지의 움직임을 완전히 제한한다|손으로 튜브나 드레싱을 잡아당기는 것을 방지한다|보행을 제한한다|체위를 유지한다", 1, "장갑형 억제대는 손가락 사용을 제한하여 IV 라인, 도뇨관 등을 뽑는 것을 방지한다."],
      ["억제대 적용 시 기록해야 하는 내용이 아닌 것은?", "적용 사유|적용 시간과 해제 시간|순환 상태 확인 결과|환자의 취미", 3, "억제대 적용 사유, 적용/해제 시간, 순환 상태, 피부 상태, 대안적 중재 시도 결과 등을 기록한다."],
      ["억제대 적용 환자의 간호로 적절하지 않은 것은?", "2시간마다 억제대를 풀어준다|ROM 운동을 시행한다|식사, 배뇨 등 기본 욕구를 충족시킨다|환자를 지속적으로 관찰하지 않아도 된다", 3, "억제대 적용 환자는 자주 관찰하여 안전을 확인하고, 기본 욕구를 충족시켜야 한다."],
      ["팔꿈치 억제대(elbow restraint)의 주요 사용 대상은?", "성인 수술 후 환자|구순열 수술 후 영아|치매 환자|정신과 환자", 1, "팔꿈치 억제대는 주로 구순열/구개열 수술 후 영아에게 적용하여 수술 부위를 만지지 않게 한다."],
      ["조끼형 억제대(vest restraint) 사용 시 주의사항은?", "꽉 조여서 움직이지 못하게 한다|앞뒤를 정확히 구분하여 입힌다|호흡 상태를 관찰할 필요 없다|항상 앙와위에서만 사용한다", 1, "조끼형 억제대는 앞뒤를 정확히 입혀야 하며, 잘못 입히면 목이 조여 질식할 위험이 있다."],
      ["억제대 적용의 윤리적 원칙으로 옳은 것은?", "환자의 자율성보다 안전이 항상 우선이다|최소한의 제한을 최소한의 시간만 적용한다|보호자가 원하면 항상 적용한다|편의를 위해 적용할 수 있다", 1, "억제대는 최소한의 제한을 최소한의 시간만 적용하며, 환자의 존엄성과 권리를 존중한다."],
      ["억제대 적용 중 발견된 순환 장애의 징후는?", "피부가 따뜻하고 분홍색이다|손가락이 차갑고 청색이다|맥박이 잘 촉지된다|통증이 없다", 1, "순환 장애 징후: 창백, 청색증, 차가움, 부종, 무감각, 저림, 맥박 감소 등이 있다."],
      ["억제대를 풀어줄 때 함께 시행해야 하는 간호는?", "즉시 다시 적용한다|ROM 운동, 피부 관찰, 체위 변경을 시행한다|환자를 혼자 두고 간다|아무것도 하지 않는다", 1, "억제대를 풀어줄 때 ROM 운동, 피부 관찰, 순환 확인, 체위 변경, 영양/수분/배설 욕구를 확인한다."],
      ["억제대 적용이 필요한 상황으로 가장 적절한 것은?", "환자가 큰 소리로 말할 때|환자가 생명 유지 장치를 자해적으로 제거하려 할 때|간호사의 업무 편의를 위해|보호자가 없을 때", 1, "억제대는 환자 자신이나 타인에게 위험을 초래할 때, 치료 장비를 제거하려 할 때 최후의 수단으로 적용한다."],
      ["사지 억제대 적용 시 가장 주의해야 할 합병증은?", "고혈압|말초 순환 장애|고혈당|호흡곤란", 1, "사지 억제대는 말초 순환 장애를 일으킬 수 있으므로, 순환 상태를 자주 확인한다."],
      ["억제대 적용 시 환자와 가족에게 설명해야 하는 내용은?", "적용 이유와 기간|억제대의 가격|다른 환자의 사례|간호사의 일정", 0, "환자와 가족에게 억제대 적용의 이유, 예상 기간, 대안적 방법 시도 결과를 설명하고 동의를 구한다."],
      ["침대 난간(side rail)의 올바른 사용에 대한 설명으로 옳은 것은?", "항상 4면 모두 올려야 한다|4면 모두 올리면 억제대로 간주될 수 있다|난간은 낙상 예방 효과가 없다|난간은 어떤 경우에도 억제대가 아니다", 1, "침대 난간 4면을 모두 올리면 환자의 자유로운 이동을 제한하므로 억제대로 간주될 수 있다."],
      ["억제대 관련 사고 예방으로 적절하지 않은 것은?", "풀기 쉬운 매듭으로 고정한다|침대 프레임에 고정한다|환자의 움직임 범위를 확인한다|억제대를 가능한 오래 유지한다", 3, "억제대는 가능한 짧은 시간만 적용하고, 상태가 호전되면 즉시 제거한다."],
      ["억제대 미적용 시 대안적 중재(비억제적 중재)가 아닌 것은?", "환경 조정(시계, 달력 등 제공)|약물을 이용한 진정|가족의 동반|주의 전환(음악, TV 등)", 1, "약물 진정(화학적 억제)은 비억제적 중재에 해당하지 않으며, 대안적 중재에는 환경 조정, 주의 전환 등이 포함된다."],
      ["억제대 적용 처방의 유효 기간은?", "1시간|8시간|24시간|무기한", 2, "억제대 처방은 보통 24시간마다 재평가하고 갱신해야 하며, 계속 필요 여부를 재사정한다."],
      ["억제대로 인한 사망 사고의 가장 흔한 원인은?", "출혈|질식(strangulation)|감염|탈수", 1, "억제대로 인한 사망은 질식(strangulation)이 가장 흔하며, 특히 조끼형 억제대에서 발생 위험이 높다."],
      ["억제대 적용 시 체위로 가장 적절한 것은?", "앙와위|측위|반좌위 또는 그 이상|복위", 2, "억제대 적용 시 반좌위 이상으로 상체를 올려 흡인과 질식을 예방한다."],
      ["소아에게 억제대를 적용할 때 추가로 고려해야 할 사항은?", "성인과 동일하게 적용한다|발달 단계에 맞는 놀이와 자극을 제공한다|항상 부모를 퇴실시킨다|억제대를 장시간 유지한다", 1, "소아는 발달 단계를 고려하여 놀이, 주의 전환을 제공하고, 부모 참여를 권장한다."],
      ["억제대를 적용하지 않고 환자 안전을 확보하는 방법으로 적절한 것은?", "침상을 가장 높이 올린다|침상을 가장 낮추고 바닥에 매트를 깐다|조명을 끈다|간호사 호출기를 제거한다", 1, "침상을 낮추고 바닥에 매트를 깔면 낙상 시 부상 위험을 줄이는 비억제적 중재가 된다."],
      ["억제대 적용 환자에게 제공해야 하는 기본 간호가 아닌 것은?", "식사 보조|배뇨/배변 보조|ROM 운동|운동 제한", 3, "억제대 적용 중에도 식사, 배뇨/배변 보조, ROM 운동, 수분 섭취 등 기본 간호를 제공한다."],
      ["억제대 사용을 줄이기 위한 간호 전략으로 옳은 것은?", "모든 환자에게 예방적으로 적용한다|일대일 관찰(1:1 sitter)을 실시한다|가족 면회를 제한한다|환자 사정을 줄인다", 1, "일대일 관찰(1:1 sitter)은 억제대 사용을 줄이는 효과적인 대안적 중재이다."],
      ["억제대 적용 시 문서화가 필요한 내용으로 옳지 않은 것은?", "대안적 중재 시도 결과|환자/가족 설명 내용|다른 환자의 억제대 사용 현황|순환 상태 확인 기록", 2, "다른 환자의 억제대 사용 현황은 해당 환자의 기록에 문서화할 내용이 아니다."],
      ["억제대 적용의 합법적 기준으로 옳은 것은?", "처벌 목적으로 사용할 수 있다|직원의 편의를 위해 사용할 수 있다|환자의 안전을 위해 최후의 수단으로만 사용한다|행정적 편의를 위해 사용할 수 있다", 2, "억제대는 처벌이나 편의가 아닌 환자 안전을 위해 최후의 수단으로만 사용해야 한다."],
      ["억제대 적용 중 환자가 극심한 불안을 보일 때 적절한 간호는?", "억제대를 더 단단히 조인다|무시한다|불안의 원인을 사정하고 치료적 의사소통을 한다|진정제를 투여한다", 2, "불안의 원인을 사정하고, 치료적 의사소통과 비억제적 중재를 먼저 시도한다."]
    ]
  },
  "15": {
    t: "더운 것과 찬 것의 적용 돕기",
    q: [
      ["온요법(heat application)의 적용 시간으로 적절한 것은?", "5분|15~20분|40~50분|60분 이상", 1, "온요법은 15~20분 적용하며, 장시간 적용하면 반동 효과(혈관 수축)가 나타날 수 있다."],
      ["냉요법(cold application)의 적용 시간으로 적절한 것은?", "5분|15~20분|40~50분|60분 이상", 1, "냉요법도 15~20분 적용하며, 장시간 적용하면 조직 손상과 동상 위험이 있다."],
      ["온요법의 생리적 효과로 옳은 것은?", "혈관 수축|대사율 감소|혈관 확장과 혈류 증가|근육 경직 촉진", 2, "온요법은 혈관을 확장시켜 혈류를 증가시키고, 근육을 이완시키며, 통증을 완화한다."],
      ["냉요법의 생리적 효과로 옳은 것은?", "혈관 확장|대사율 증가|혈관 수축과 부종 감소|근육 이완", 2, "냉요법은 혈관을 수축시켜 출혈과 부종을 감소시키고, 통증과 염증을 줄인다."],
      ["온요법의 적용 금기 대상으로 적절한 것은?", "근육 경직 환자|관절 강직 환자|출혈 부위|만성 관절통 환자", 2, "출혈 부위에 온요법을 적용하면 혈관 확장으로 출혈이 증가하므로 금기이다."],
      ["냉요법이 적합한 경우는?", "만성 관절통|급성 염좌 직후|근육 경축|신장 산통", 1, "급성 염좌 직후에는 냉요법으로 혈관을 수축시켜 부종과 출혈을 줄인다."],
      ["습열 요법(moist heat)의 예로 옳은 것은?", "더운 물 주머니|전기 패드|온습포(warm compress)|적외선등", 2, "습열 요법에는 온습포, 좌욕, 반신욕 등이 있으며, 수분을 통해 열이 전달된다."],
      ["건열 요법(dry heat)의 예로 옳은 것은?", "온습포|좌욕|더운 물 주머니|반신욕", 2, "건열 요법에는 더운 물 주머니, 전기 패드, 적외선등 등이 있다."],
      ["온요법 적용 시 화상 위험이 높은 대상자는?", "젊은 성인|감각 장애가 있는 환자|피부가 건강한 환자|의식이 명료한 환자", 1, "감각 장애 환자는 열 자극을 느끼지 못하므로 화상 위험이 높아 주의해야 한다."],
      ["좌욕(sitz bath)의 적용 온도로 적절한 것은?", "25~30°C|37~40°C|45~50°C|55~60°C", 1, "좌욕은 37~40°C(또는 40~43°C)의 온수를 사용하며, 회음부 청결과 통증 완화에 효과적이다."],
      ["더운 물 주머니 적용 시 주의사항으로 옳은 것은?", "피부에 직접 접촉시킨다|커버를 씌워 적용한다|가능한 뜨거울수록 효과적이다|잠자는 동안 계속 적용한다", 1, "더운 물 주머니는 반드시 커버를 씌워 화상을 예방하고, 피부 상태를 수시로 확인한다."],
      ["반동 현상(rebound phenomenon)이란?", "온요법 후 혈관 확장이 지속되는 것|장시간 온요법 후 혈관이 수축되는 것|냉요법 후 혈관 수축이 지속되는 것|온요법 후 체온이 상승하는 것", 1, "온요법을 20~30분 이상 장시간 적용하면 반동 현상으로 혈관이 오히려 수축된다."],
      ["냉요법 적용 금기 대상으로 적절한 것은?", "급성 염좌 환자|편두통 환자|레이노 병(Raynaud's disease) 환자|발치 직후 환자", 2, "레이노 병 환자는 말초혈관이 과민 반응하므로 냉요법 적용이 금기이다."],
      ["아이스백(ice bag) 적용 시 주의사항으로 옳은 것은?", "피부에 직접 접촉시킨다|커버를 씌워 적용한다|1시간 이상 지속 적용한다|주기적인 피부 확인은 불필요하다", 1, "아이스백도 커버를 씌워 적용하고, 15~20분 적용 후 피부 상태를 확인한다."],
      ["온습포 적용 시 적절한 온도는?", "30~35°C|40~46°C|50~55°C|60~65°C", 1, "온습포는 40~46°C가 적절하며, 습열은 건열보다 열 전도가 빨라 낮은 온도에서도 효과적이다."],
      ["온요법이 통증을 완화하는 기전은?", "통증 수용기를 파괴한다|근육을 수축시킨다|엔돌핀 분비를 촉진하고 근육을 이완시킨다|신경 전도를 차단한다", 2, "온요법은 엔돌핀 분비를 촉진하고 근육을 이완시키며, 혈류 증가로 대사산물을 제거한다."],
      ["냉요법이 통증을 완화하는 기전은?", "혈관을 확장시킨다|신경 전도 속도를 감소시킨다|근육을 이완시킨다|대사율을 증가시킨다", 1, "냉요법은 신경 전도 속도를 감소시켜 통증 신호 전달을 줄이고, 부종을 감소시킨다."],
      ["습열 요법이 건열 요법보다 효과적인 이유는?", "적용이 간편해서|열 전도율이 높아 침투력이 좋아서|화상 위험이 적어서|비용이 저렴해서", 1, "습열은 수분을 통해 열이 전달되므로 건열보다 열 전도율이 높고 조직 침투력이 좋다."],
      ["부항(cupping) 후 피부가 붉어지는 이유는?", "혈관 수축|국소적 혈관 확장으로 인한 충혈|피부 감염|알레르기 반응", 1, "부항은 음압을 이용하여 국소적으로 혈관을 확장시켜 충혈이 나타나며, 이는 정상 반응이다."],
      ["수술 후 출혈 부위에 적용하는 요법은?", "온요법|냉요법|온습포|좌욕", 1, "수술 후 출혈 부위에는 냉요법을 적용하여 혈관을 수축시키고 출혈과 부종을 줄인다."],
      ["더운 물 주머니의 적절한 수온은?", "30~35°C|40~52°C|55~60°C|65~70°C", 1, "더운 물 주머니의 수온은 성인 40~52°C가 적절하며, 노인이나 영아는 더 낮은 온도를 사용한다."],
      ["온요법 장시간 적용 시 나타나는 반동 효과로 인한 위험은?", "조직 대사 촉진|2차 출혈이나 부종 증가|체온 하강|혈압 상승", 1, "온요법 장시간 적용 시 반동 효과로 원래 목적과 반대되는 혈관 수축이 일어나거나, 지속 적용 시 과도한 혈관 확장으로 출혈과 부종이 증가할 수 있다."],
      ["냉요법 장시간 적용 시 나타나는 합병증은?", "화상|조직 괴사와 동상|부종 증가|감염", 1, "냉요법을 장시간 적용하면 혈류 감소로 조직 괴사와 동상이 발생할 수 있다."],
      ["적외선등(infrared lamp) 적용 시 적절한 거리는?", "10~15cm|25~30cm|45~60cm|100cm", 2, "적외선등은 피부에서 45~60cm 거리를 유지하여 화상을 예방한다."],
      ["온냉요법의 효과를 높이기 위한 방법으로 적절하지 않은 것은?", "적절한 온도를 유지한다|적용 시간을 준수한다|가능한 넓은 면적에 적용한다|환자의 피부 반응을 관찰한다", 2, "넓은 면적에 적용하면 전신적 반응(저혈압, 저체온 등)이 나타날 수 있으므로 국소적으로 적용한다."],
      ["좌욕의 적용 시간으로 적절한 것은?", "5분|15~20분|40분|60분", 1, "좌욕은 15~20분 적용하며, 장시간 적용하면 회음부 부종이나 어지러움이 발생할 수 있다."],
      ["온요법 적용 후 피부 사정에서 비정상적인 소견은?", "약간의 홍조|수포(blister) 형성|피부가 따뜻함|경미한 발적", 1, "수포 형성은 화상의 징후이므로 즉시 온요법을 중단하고 보고해야 한다."],
      ["냉요법 적용 후 피부가 창백하고 무감각하면 적절한 처치는?", "냉요법을 계속 적용한다|냉요법을 즉시 중단하고 보고한다|온요법으로 전환한다|마사지를 한다", 1, "창백, 무감각은 조직 손상의 초기 징후이므로 즉시 중단하고 보고한다."],
      ["편두통 환자에게 적용하는 요법으로 적절한 것은?", "후두부에 온요법|이마와 관자놀이에 냉요법|전신 온요법|환부에 온습포", 1, "편두통 시 이마와 관자놀이에 냉요법을 적용하여 혈관 수축과 통증 완화 효과를 얻는다."],
      ["온냉요법 적용 시 공통적인 주의사항으로 옳은 것은?", "피부 사정 없이 적용한다|감각 장애 환자에게 우선 적용한다|적용 전후로 피부 상태를 관찰한다|적용 시간에 제한이 없다", 2, "온냉요법 적용 전후 피부 상태를 관찰하여 화상, 동상, 순환 장애 등을 조기 발견한다."]
    ]
  },
  "16": {
    t: "섭취량과 배설량 측정 돕기",
    q: [
      ["I&O(섭취량과 배설량) 측정 시 1mL는 몇 g으로 환산하는가?", "0.5g|1g|2g|5g", 1, "수분의 경우 1mL = 1g으로 환산하여 측정한다."],
      ["섭취량(intake)에 포함되는 항목이 아닌 것은?", "경구 섭취량|정맥 수액량|경관영양 주입량|호흡으로 배출된 수분", 3, "호흡으로 배출된 수분은 배설량(불감 수분 소실)에 해당하며, 섭취량에는 포함되지 않는다."],
      ["배설량(output)에 포함되는 항목이 아닌 것은?", "소변량|구토물|수술 중 출혈량|정맥 수액량", 3, "정맥 수액량은 섭취량에 해당하며, 배설량에는 소변, 구토물, 배액물, 출혈량 등이 포함된다."],
      ["불감 수분 소실(insensible water loss)의 경로는?", "소변과 대변|피부와 호흡|구토와 설사|상처 배액", 1, "불감 수분 소실은 피부 증발과 호흡을 통해 배출되며, 하루 약 600~900mL이다."],
      ["정상 성인의 하루 수분 섭취 권장량은?", "500~800mL|1000~1200mL|1500~2000mL|3000~4000mL", 2, "정상 성인의 하루 수분 섭취 권장량은 약 1500~2000mL(또는 2000~2500mL)이다."],
      ["탈수(dehydration)의 징후로 옳은 것은?", "체중 증가|피부 탄력성 감소(turgor 감소)|혈압 상승|소변량 증가", 1, "탈수 시 피부 탄력성이 감소하고, 구강 건조, 소변량 감소, 체중 감소, 빈맥 등이 나타난다."],
      ["부종(edema)의 징후로 옳은 것은?", "체중 감소|피부를 눌렀을 때 함몰(pitting)|소변량 증가|피부 건조", 1, "부종 시 피부를 눌렀을 때 함몰이 나타나며(pitting edema), 체중 증가, 소변량 감소 등이 동반된다."],
      ["I&O 측정 시 소변량 측정 방법으로 옳은 것은?", "대략적으로 추정한다|눈금이 있는 용기(소변통)로 정확히 측정한다|체중으로만 측정한다|색깔로 판단한다", 1, "소변량은 눈금이 있는 용기로 정확히 측정하고 mL 단위로 기록한다."],
      ["체중 1kg 증가는 대략 몇 mL의 수분 저류를 의미하는가?", "500mL|1000mL|1500mL|2000mL", 1, "체중 1kg 증가는 약 1000mL(1L)의 수분 저류를 의미한다."],
      ["I&O 기록 시 젤라틴, 아이스크림 등은 어떻게 처리하는가?", "측정하지 않는다|실온에서 액체가 되므로 섭취량에 포함한다|배설량에 포함한다|고형식으로 별도 기록한다", 1, "젤라틴, 아이스크림, 아이스바 등은 실온에서 액체가 되므로 섭취량에 포함한다."],
      ["수분 제한(fluid restriction)이 필요한 대상자는?", "탈수 환자|신부전으로 핍뇨가 있는 환자|발열 환자|설사 환자", 1, "신부전으로 핍뇨가 있는 환자는 수분 저류를 방지하기 위해 수분 제한이 필요하다."],
      ["I&O 균형 평가 시 양의 균형(positive balance)이란?", "섭취량이 배설량보다 많다|배설량이 섭취량보다 많다|섭취량과 배설량이 같다|측정하지 않는다", 0, "양의 균형은 섭취량 > 배설량으로, 수분 저류 상태를 의미한다."],
      ["음의 균형(negative balance)이 의미하는 것은?", "수분 과다|탈수 위험|정상 상태|부종", 1, "음의 균형은 배설량 > 섭취량으로, 탈수 위험을 의미한다."],
      ["I&O 기록 시 비위관 배액량은 어디에 기록하는가?", "섭취량|배설량|별도 기록하지 않음|섭취량에서 차감", 1, "비위관 배액량은 배설량(output)에 기록한다."],
      ["탈수 시 나타나는 소변의 특성은?", "맑고 묽은 소변|진한 색의 농축된 소변|혈뇨|거품이 많은 소변", 1, "탈수 시 소변이 농축되어 진한 호박색을 띠며, 비중이 증가한다."],
      ["수분 과다(fluid overload)의 징후가 아닌 것은?", "호흡곤란|경정맥 팽대|체중 감소|폐 수포음", 2, "체중 감소는 탈수의 징후이며, 수분 과다 시에는 체중 증가, 호흡곤란, 경정맥 팽대, 폐 수포음이 나타난다."],
      ["I&O 측정을 시작하는 시점은?", "의사 처방 시점부터|입원 시부터 자동으로|환자가 요청할 때|수술 후에만", 0, "I&O 측정은 의사 처방에 의해 시작하며, 24시간 동안 모든 섭취량과 배설량을 기록한다."],
      ["수액 주입 속도가 125mL/hr일 때 8시간 동안 주입되는 총량은?", "500mL|750mL|1000mL|1500mL", 2, "125mL/hr × 8시간 = 1000mL"],
      ["I&O 기록 시 대변의 수분은 어떻게 처리하는가?", "정확히 측정한다|일반적으로 기록하지 않으나, 설사 시에는 기록한다|항상 100mL로 기록한다|무시한다", 1, "정상 대변의 수분은 보통 기록하지 않지만, 설사가 심한 경우 양을 추정하여 배설량에 기록한다."],
      ["탈수의 검사실 소견으로 옳은 것은?", "BUN 감소|혈중 나트륨 감소|헤마토크리트(Hct) 상승|소변 비중 감소", 2, "탈수 시 혈액이 농축되어 헤마토크리트(Hct)가 상승하고, 소변 비중도 증가한다."],
      ["I&O 기록표에서 24시간 총계를 산출하는 시간대는?", "오전 6시~다음 날 오전 6시|오전 7시~다음 날 오전 7시|자정~다음 날 자정|오후 12시~다음 날 오후 12시", 1, "일반적으로 24시간 I&O는 오전 7시(또는 기관별 정해진 시간)부터 다음 날 같은 시간까지 산출한다."],
      ["수분 제한 환자의 간호로 적절한 것은?", "갈증 해소를 위해 원하는 만큼 물을 제공한다|총 수분량을 낮, 저녁, 밤으로 나누어 배분한다|차가운 음료를 제한 없이 제공한다|구강 건조는 무시한다", 1, "수분 제한 시 허용된 총량을 낮(50%), 저녁(30%), 밤(20%) 등으로 배분하여 제공한다."],

      ["탈수 시 피부 탄력성(skin turgor) 검사 부위로 적절한 것은?", "손등|전완 내측 또는 쇄골 부위|발바닥|두피", 1, "피부 탄력성은 전완 내측이나 쇄골 부위에서 검사하며, 2초 이상 돌아오지 않으면 탈수를 의심한다."],

"17": {
    t: "습도 유지 및 산소 요움 돕기",
    q: [
      ["비강 캐뉼라로 산소를 투여할 때 적절한 유량 범위는?", "0.5~1L/min|1~6L/min|7~10L/min|10~15L/min", 1, "비강캐뉼라는 1~6L/min(24~44%)이 적절하며, 6L 초과 시 비점막 건조와 자극이 발생한다"],
      ["비강 캐뉼라로 산소 4L/min 투여 시 예상되는 흡입산소농도(FiO2)는 약 얼마인가?", "24%|28%|36%|44%", 2, "비강캐뉼라는 1L당 약 4%씩 증가하여 4L/min일 때 21%+(4×4%)=약 37%, 가장 가까운 것은 36%이다"],

      ["비재호흡 마스크(non-rebreather mask)로 제공 가능한 최대 산소 농도는 약 얼마인가?", "60%|70%|80%|100%", 3, "비재호흡 마스크는 일방향 밸브와 저장백이 있어 10~15L/min으로 최대 약 100%에 가까운 산소를 제공한다"],
      ["맥박산소측정기(pulse oximeter)로 측정하는 것은?", "동맥혈 산소분압(PaO2)|동맥혈 산소포화도(SpO2)|호기말 이산화탄소(EtCO2)|혼합정맥혈 산소포화도(SvO2)", 1, "맥박산소측정기는 비침습적으로 말초 동맥혈의 산소포화도(SpO2)를 측정하는 기구이다"],
      ["정상 SpO2 수치 범위는?", "85~90%|90~94%|95~100%|100%", 2, "정상 SpO2는 95~100%이며, 90% 미만은 저산소혈증으로 즉각적인 중재가 필요하다"],
      ["SpO2 측정이 부정확해질 수 있는 상황은?", "안정 시 측정|손가락에 매니큐어를 바른 경우|앙와위에서 측정|산소 투여 중 측정", 1, "매니큐어, 말초순환장애, 저체온, 심한 빈혈, 과도한 움직임 등은 SpO2 측정의 정확도를 떨어뜨린다"],
      ["가습기를 산소 공급 장치에 연결하는 주된 목적은?", "산소 농도를 높이기 위해|기도 점막의 건조를 방지하기 위해|산소 유량을 조절하기 위해|감염을 예방하기 위해", 1, "건조한 산소가 기도 점막을 자극하고 분비물을 건조시키므로 가습기로 습도를 유지한다"],
      ["산소 텐트 사용 시 간호로 옳은 것은?", "텐트 안에서 전기 장난감 사용 허용|텐트를 자주 열어 환기|텐트 내 온도와 습도를 정기적으로 확인|텐트를 밀폐하여 절대 열지 않음", 2, "산소 텐트는 내부 온도와 습도가 변하기 쉬우므로 정기적으로 확인하고, 전기 기구 사용을 금한다"],
      ["흡입산소농도(FiO2)가 60% 이상을 24~48시간 이상 투여 시 우려되는 합병증은?", "저산소혈증|산소독성(폐독성)|호흡성 산증|대사성 알칼로증", 1, "고농도 산소의 장기간 투여는 폐포 손상, 무기폐 등 산소독성을 유발할 수 있다"],
      ["비강 캐뉼라 사용 시 간호로 옳은 것은?", "캐뉼라 끝이 위를 향하게 삽입|8시간마다 코 점막 상태 확인 및 구강 간호|산소 유량은 10L/min까지 가능|가습기는 연결하지 않음", 1, "비강캐뉼라 사용 시 코 점막 건조와 자극을 예방하기 위해 정기적으로 확인하고 구강간호를 제공한다"],
      ["산소 유량계를 사용할 때 볼(ball)이 떠 있는 위치의 기준은?", "볼의 상단|볼의 중앙|볼의 하단|볼의 어떤 위치든 상관없음", 1, "유량계의 볼은 중앙 부분을 기준으로 눈금을 읽는다"],
      ["산소 봄베(탱크) 사용 시 주의사항으로 옳은 것은?", "직사광선이 드는 곳에 보관|사용 후 밸브를 열어둠|넘어지지 않도록 고정하여 보관|기름을 사용하여 밸브를 윤활", 2, "산소 탱크는 넘어지면 폭발 위험이 있으므로 반드시 고정하고, 기름은 화재 위험이 있어 사용을 금한다"],
      ["호흡곤란 환자에게 취해 주는 가장 적절한 체위는?", "앙와위(supine)|좌위 또는 반좌위(Fowler's)|복위(prone)|측위(lateral)", 1, "좌위 또는 반좌위는 횡격막을 내려 폐 확장을 촉진하고 호흡을 용이하게 한다"],

      ["T-piece(T자관)는 주로 어떤 환자에게 사용하는가?", "비강 캐뉼라 사용이 불가능한 환자|기관절개관 또는 기관내관이 있는 환자|소아 환자|의식이 명료한 환자", 1, "T-piece는 기관절개관이나 기관내관에 연결하여 산소와 습기를 공급하는 장치이다"],

      ["산소 투여의 목표 SpO2가 88~92%인 대상자는?", "심부전 환자|만성폐쇄성폐질환(COPD) 환자|천식 환자|폐렴 환자", 1, "COPD 환자는 저산소성 호흡 자극에 의존하므로 SpO2 88~92%를 목표로 저유량 산소를 투여한다"],

  "18": {

function parseBank(raw) {
  const bank = {};
  for (const [id, ch] of Object.entries(raw)) {
    bank[id] = {
      title: ch.t,
      questions: ch.q.map((item, i) => ({
        id: id + '-' + String(i+1).padStart(3,'0'),
        q: item[0],
        options: item[1].split('|'),
        answer: item[2],
        explanation: item[3]
      }))
    };
  }
  return bank;
}
